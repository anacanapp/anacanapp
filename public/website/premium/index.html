<!doctype html>
<html lang="az" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#ffe7e1">
  <title>Anacan Premium</title>
  <link rel="icon" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="stylesheet" href="/website/premium/premium.css?v=2">

<body>
  <main class="funnel" aria-live="polite">

      <button type="button" class="back" id="back" hidden aria-label="Back">‹</button>

    <div class="bar" aria-hidden="true"><i id="progress"></i></div>
    <section id="view" class="view"></section>
    <div id="checkout-wrap" class="checkout" hidden><div id="dodo-inline-checkout"></div></div>

  <script src="/website/premium/dodo-checkout-2.0.1.js"></script>
