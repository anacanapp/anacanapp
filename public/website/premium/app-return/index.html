<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Anacan Premium</title>
<style>
:root{--coral:#ff5a5f;--ink:#333;--soft:#7a6e68;--bg:#fff7f3;--ok:#2f8f5b;--err:#c0392b}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);padding:24px 16px}
.card{width:100%;max-width:420px;background:#fff;border-radius:24px;padding:28px 24px;text-align:center;box-shadow:0 18px 40px -24px rgba(0,0,0,.25)}
.logo{width:56px;height:56px;margin:0 auto 14px;display:block}
.badge{width:52px;height:52px;border-radius:999px;margin:0 auto 12px;display:grid;place-items:center;font-size:26px;font-weight:900;color:#fff;background:var(--ok)}
.badge.err{background:var(--err)}
h1{font-size:21px;margin:0 0 8px;line-height:1.3}
p{margin:0 0 18px;color:var(--soft);font-size:15px;line-height:1.5}
.btn{display:block;width:100%;padding:14px 18px;border-radius:999px;font-weight:800;font-size:15px;text-decoration:none;margin-top:10px;background:var(--coral);color:#fff}
.hide{display:none}
small{display:block;margin-top:16px;color:#aaa;font-size:12px}
</style>
</head>
<body>
<main class="card">
  <img class="logo" src="/website/premium/account/mark-coral.png" alt="Anacan">
  <div class="badge" id="badge" aria-hidden="true">✓</div>
  <h1 id="title">Ödəniş qəbul olundu, tətbiqə qayıdın</h1>
  <p id="text">Premium bir neçə saniyə ərzində tətbiqdə aktiv olacaq.</p>
  <a class="btn" id="open" href="anacan://premium">Tətbiqə qayıt</a>
  <small>Anacan · anacan.az</small>
</main>
<script>
(function () {
  'use strict';
  // Return page of a Premium card payment started inside the Anacan app (web-premium subscribe, page 'app').
  // The payment itself is confirmed only by Epoint's signed callback on the server; this page just says where to go.
  var params = new URLSearchParams(location.search);
  var ok = params.get('odenis') !== 'xeta';
  var fromWeb = params.get('from') === 'web';
  var lang = (params.get('lang') || navigator.language || 'az').slice(0, 2).toLowerCase();
  if (['az', 'ru', 'en'].indexOf(lang) < 0) lang = ['kk', 'ky', 'uz', 'tk', 'uk', 'be'].indexOf(lang) >= 0 ? 'ru' : 'en';
  var copy = {
    az: { okTitle: 'Ödəniş qəbul olundu, tətbiqə qayıdın', okText: 'Premium bir neçə saniyə ərzində tətbiqdə aktiv olacaq.',
          errTitle: 'Ödəniş alınmadı', errText: 'Kartınızdan pul çıxılmayıb. Tətbiqə qayıdıb yenidən cəhd edin.', button: 'Tətbiqə qayıt' },
    ru: { okTitle: 'Оплата принята, вернитесь в приложение', okText: 'Premium активируется в приложении в течение нескольких секунд.',
          errTitle: 'Оплата не прошла', errText: 'Деньги с карты не списаны. Вернитесь в приложение и попробуйте ещё раз.', button: 'Вернуться в приложение' },
    en: { okTitle: 'Payment received, please return to the app', okText: 'Premium will be active in the app within a few seconds.',
          errTitle: 'Payment did not go through', errText: 'Your card was not charged. Return to the app and try again.', button: 'Return to the app' }
  }[lang];
  document.documentElement.lang = lang;
  document.getElementById('title').textContent = ok ? copy.okTitle : copy.errTitle;
  document.getElementById('text').textContent = ok ? copy.okText : copy.errText;
  var badge = document.getElementById('badge');
  if (!ok) { badge.textContent = '!'; badge.className = 'badge err'; }
  var open = document.getElementById('open');
  open.textContent = copy.button;

  var ua = navigator.userAgent || '';
  var isAndroid = /Android/i.test(ua);
  var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (fromWeb || (!isAndroid && !isIOS)) {
    // Started in the web app: go back to it.
    open.href = 'https://app.anacan.az/';
    return;
  }
  // anacan://premium opens the app on its Premium screen (src/lib/deeplink.ts). On Android an intent URL also works
  // from Chrome Custom Tabs.
  if (isAndroid) open.href = 'intent://premium#Intent;scheme=anacan;package=com.atlasoon.anacan;end';
  if (ok) setTimeout(function () { location.href = open.href; }, 600);
})();
</script>
</body>
</html>
