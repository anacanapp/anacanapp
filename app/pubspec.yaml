name: anacan
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.14.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  supabase_flutter: ^2.18.3
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6
  crypto: ^3.0.8
  http: ^1.6.0
  flutter_svg: ^2.5.1
  intl: ^0.20.3
  flutter_localizations:
    sdk: flutter
  connectivity_plus: ^7.3.2
  url_launcher: ^6.3.3
  package_info_plus: ^10.2.2
  device_info_plus: ^13.3.0
  cached_network_image: ^4.0.7
  purchases_flutter: ^12.0.0
  purchases_ui_flutter: ^12.0.0
  flutter_widget_from_html: ^0.17.4
  image_picker: ^1.2.4
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.2.0
  share_plus: ^13.3.1
  in_app_review: ^2.0.12
  local_auth: ^3.0.2
  flutter_markdown_plus: ^1.0.12
  fl_chart: ^1.3.1
  video_player: ^2.14.1
  flutter_timezone: ^5.1.1
  app_links: ^7.2.2
  local_auth_android: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/icons/
    - assets/icons/lucide/
    - assets/icons/remix/
    - assets/icons/sonner/
    - assets/i18n/
    - assets/games/word_garden/
    - assets/games/iki_dost/
    - assets/games/parking/
    - assets/games/casual/
    - assets/games/color_sort/
    - assets/games/qabarciq/
    - assets/games/birlesdir/
    - assets/games/saglam_sebet/
    - assets/images/
    - assets/images/onboarding/
    - assets/images/fetus/
    - assets/images/entry/
    - assets/images/entry/flags/
    - assets/images/entry/onboarding/
    - assets/images/profile/
    - assets/images/profile/flags/
    - assets/images/recap/
    - assets/recap/
    - assets/stickers/
    - assets/play_together/
    - assets/books/
    - assets/books/covers/
    - assets/kid_exercises/
    - assets/exercises/0-1/
    - assets/exercises/1-2/
    - assets/exercises/2-3/
    - assets/exercises/3-4/
    - assets/exercises/4-5/
    - assets/affiliate/

  # Bundled fonts (app/tool/design/fetch_fonts.sh). Weights = the ones the web app loads
  # (src/index.css Google Fonts @import, src/lib/rtl.ts @fontsource imports).
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/nunito/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/nunito/Nunito-Medium.ttf
          weight: 500
        - asset: assets/fonts/nunito/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/nunito/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/nunito/Nunito-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/nunito/Nunito-Black.ttf
          weight: 900
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/inter/Inter-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/inter/Inter-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/inter/Inter-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/inter/Inter-BoldItalic.ttf
          weight: 700
          style: italic
    - family: Noto Sans Arabic
      fonts:
        - asset: assets/fonts/noto_sans_arabic/NotoSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/noto_sans_arabic/NotoSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/noto_sans_arabic/NotoSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/noto_sans_arabic/NotoSansArabic-Bold.ttf
          weight: 700
        - asset: assets/fonts/noto_sans_arabic/NotoSansArabic-ExtraBold.ttf
          weight: 800
    # Anacan Recap canvas fonts (src/lib/recap/fonts.ts). Plus Jakarta Sans: static instances of the OFL variable
    # font (google/fonts); Switzer: the woff2 files the app already ships (public/recap/fonts) converted to TTF;
    # Noto Sans / Noto Naskh Arabic: public/fonts.
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/recap/PlusJakartaSans-400.ttf
          weight: 400
        - asset: assets/fonts/recap/PlusJakartaSans-600.ttf
          weight: 600
        - asset: assets/fonts/recap/PlusJakartaSans-800.ttf
          weight: 800
    - family: Switzer
      fonts:
        - asset: assets/fonts/recap/Switzer-400.ttf
          weight: 400
        - asset: assets/fonts/recap/Switzer-500.ttf
          weight: 500
        - asset: assets/fonts/recap/Switzer-700.ttf
          weight: 700
    - family: Recap Noto Sans
      fonts:
        - asset: assets/fonts/recap/NotoSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/recap/NotoSans-Bold.ttf
          weight: 700
    - family: Recap Noto Naskh Arabic
      fonts:
        - asset: assets/fonts/recap/NotoNaskhArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/recap/NotoNaskhArabic-Bold.ttf
          weight: 700
