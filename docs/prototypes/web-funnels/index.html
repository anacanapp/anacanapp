<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anacan veb funnel prototipləri</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Six clickable web funnel prototypes for Anacan Premium (2026-11-24). Prices are the live web prices:
   yearly 50.98 ₼ (= $29.99), monthly 6.78 ₼ (= $3.99); Mərcan Cümə 16.99 / 3.39 ₼. Brand: coral #ff5a5f, peach,
   Plus Jakarta Sans for display, Inter for UI, characters Ritm, Tumurcuq and Qucaq. */
:root{--coral:#ff5a5f;--coral-d:#d93a42;--peach:#ffe5dc;--cream:#fff8f4;--blush:#fff0eb;--ink:#2a1f20;--muted:#6e625d;--line:#2a1f2014;
--ritm:#e8434b;--tum:#8f52cf;--qucaq:#23966f;--ritm-bg:#ffe9e8;--tum-bg:#f3eafc;--qucaq-bg:#e3f5ee;--ok:#16794a;
--d:'Plus Jakarta Sans',system-ui,sans-serif;--u:'Inter',system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:#f6efe9;color:var(--ink);font:400 15px/1.5 var(--u)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
h1,h2,h3,p{margin:0}
.app{display:grid;grid-template-columns:270px 420px minmax(0,1fr);gap:28px;max-width:1360px;margin:0 auto;padding:28px 24px;min-height:100vh}
@media(max-width:1100px){.app{grid-template-columns:1fr;max-width:460px}.side{order:0}.notes{order:2}}
.brand{display:flex;align-items:center;gap:10px;font:800 22px/1 var(--d);letter-spacing:-.03em;margin-bottom:6px}.brand img{width:28px}
.side small{color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:8px;margin-top:22px}
.nav button{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:14px;border-radius:18px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line)}
.nav button[aria-pressed=true]{box-shadow:inset 0 0 0 2px var(--coral);background:#fff}
.nav .n{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:10px;background:var(--blush);color:var(--coral-d);font:800 14px var(--d)}
.nav b{display:block;font:700 15px/1.25 var(--d)}.nav span{font-size:12.5px;color:var(--muted)}
.nav .sys .n{background:var(--ink);color:#fff}
/* phone */
.phone{position:sticky;top:20px;align-self:start;width:400px;max-width:100%;height:820px;border-radius:46px;background:#111;padding:12px;box-shadow:0 30px 60px -30px #00000066}
.scr{position:relative;height:100%;border-radius:36px;overflow:hidden;background:#fff;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:10px;padding:16px 18px 10px}
.bar .back{width:34px;height:34px;border-radius:50%;background:var(--blush);color:var(--coral-d);font-weight:700}
.prog{flex:1;height:6px;border-radius:6px;background:var(--line);overflow:hidden}.prog i{display:block;height:100%;background:var(--coral);transition:width .3s}
.bar .x{width:34px;height:34px;border-radius:50%;background:#f3ecea;font-weight:700}
.body{flex:1;overflow-y:auto;padding:6px 22px 22px;display:flex;flex-direction:column;gap:14px}
.foot{padding:12px 22px 22px}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border-radius:999px;background:var(--coral);color:#fff;font:700 16px var(--d);box-shadow:0 10px 20px -12px #d93a42aa}
.cta[disabled]{opacity:.4;cursor:not-allowed}
.cta.ghost{background:#fff;color:var(--coral-d);box-shadow:inset 0 0 0 1.5px var(--coral)}
.link{display:block;margin:10px auto 0;color:var(--muted);font-size:13.5px;text-decoration:underline;text-underline-offset:4px}
.eyebrow{font:700 11.5px var(--u);letter-spacing:.08em;text-transform:uppercase;color:var(--coral-d)}
.h{font:800 26px/1.15 var(--d);letter-spacing:-.02em}.h em{font-style:normal;color:var(--coral-d)}
.sub{color:var(--muted);font-size:14.5px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;border-radius:18px;background:var(--cream);box-shadow:inset 0 0 0 1.5px var(--line);font:600 15px var(--u)}
.opt .e{font-size:22px;width:28px;text-align:center}.opt[aria-pressed=true]{box-shadow:inset 0 0 0 2px var(--coral);background:#fff}
.opt .ck{margin-left:auto;width:22px;height:22px;border-radius:7px;box-shadow:inset 0 0 0 2px #2a1f2033}.opt[aria-pressed=true] .ck{background:var(--coral);box-shadow:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid2 .opt{flex-direction:column;align-items:flex-start;gap:6px;min-height:96px}
.likert{display:flex;gap:8px}.likert button{flex:1;height:54px;border-radius:16px;background:var(--cream);box-shadow:inset 0 0 0 1.5px var(--line);font:800 18px var(--d)}
.likert button[aria-pressed=true]{background:var(--coral);color:#fff;box-shadow:none}
.lk{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.hero{border-radius:28px;padding:22px;color:#fff;background:linear-gradient(160deg,#ff6a63,var(--coral) 50%,#f2484f);position:relative;overflow:hidden}
.hero h2{font:800 30px/1.08 var(--d);letter-spacing:-.03em}.hero p{opacity:.95;margin-top:8px}
.trio{display:flex;justify-content:center;align-items:flex-end;margin-top:12px}.trio img{width:96px}.trio img:nth-child(2){width:116px;margin:0 -14px;z-index:1}
.proof{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;background:var(--cream);font-size:13.5px}
.proof b{font:800 18px var(--d)}
.card{padding:16px;border-radius:20px;background:var(--cream);box-shadow:inset 0 0 0 1px var(--line)}
.card.w{background:#fff;box-shadow:0 1px 2px #0000000d,0 10px 24px -14px #c9333b33}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{padding:5px 11px;border-radius:999px;background:var(--blush);color:var(--coral-d);font:600 12.5px var(--u)}
.list{display:flex;flex-direction:column;gap:9px;margin:0;padding:0;list-style:none}.list li{display:flex;gap:10px;font-size:14.5px}.list li:before{content:"✓";flex:none;display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--qucaq-bg);color:var(--qucaq);font-weight:800;font-size:12px}
.lock li:before{content:"🔒";background:var(--blush)}
.plans{display:flex;flex-direction:column;gap:10px}
.plan{position:relative;display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:16px;border-radius:20px;background:var(--cream);box-shadow:inset 0 0 0 1.5px var(--line)}
.plan[aria-pressed=true]{background:#fff;box-shadow:inset 0 0 0 2.5px var(--coral)}
.plan .rd{flex:none;width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 2px #2a1f2033}.plan[aria-pressed=true] .rd{box-shadow:inset 0 0 0 7px var(--coral)}
.plan b{display:block;font:800 16px var(--d)}.plan small{color:var(--muted);font-size:12.5px}
.plan .pd{margin-left:auto;text-align:right}.plan .pd b{font:800 20px var(--d)}.plan .pd s{color:var(--muted);font-size:12.5px}
.badge{position:absolute;top:-10px;left:16px;padding:3px 10px;border-radius:999px;background:var(--coral);color:#fff;font:700 11px var(--u);letter-spacing:.03em}
.timer{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-radius:16px;background:var(--qucaq-bg);color:#0f5a40;font:600 13.5px var(--u)}
.timer b{font:800 20px var(--d);font-variant-numeric:tabular-nums}
.bf{background:var(--ink)}
.cd{display:flex;gap:6px}.cd div{flex:1;padding:8px 4px;border-radius:12px;background:#fff;color:var(--coral-d);text-align:center;font:800 20px var(--d)}.cd small{display:block;font:600 10px var(--u);color:var(--muted)}
.loader .row{display:flex;justify-content:space-between;font:600 13.5px var(--u);margin-bottom:6px}.loader .bar2{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin-bottom:14px}.loader .bar2 i{display:block;height:100%;background:var(--coral);width:0}
.modal{position:absolute;inset:0;background:#2a1f2066;display:grid;place-items:center;padding:24px;z-index:5}
.modal .box{background:#fff;border-radius:24px;padding:20px;width:100%;text-align:center;display:flex;flex-direction:column;gap:12px}
.rv{padding:14px;border-radius:18px;background:#fff;box-shadow:inset 0 0 0 1px var(--line);font-size:13.5px}.rv .st{color:#f5a524;letter-spacing:2px}.rv small{color:var(--muted)}
.input{width:100%;min-height:52px;padding:0 16px;border-radius:16px;border:1.5px solid #2a1f2026;background:var(--cream);font:500 16px var(--u)}
.consent{display:flex;gap:10px;font-size:12.5px;color:var(--muted);align-items:flex-start}.consent input{accent-color:var(--coral);width:18px;height:18px;margin-top:2px}
.tl{display:flex;flex-direction:column;gap:0}.tl div{display:flex;gap:12px;padding-bottom:16px;position:relative}.tl div:not(:last-child):after{content:"";position:absolute;left:15px;top:32px;bottom:0;width:2px;background:var(--peach)}
.tl i{flex:none;display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--coral);color:#fff;font-style:normal;font-size:15px}.tl b{display:block;font:700 15px var(--d)}.tl span{font-size:13.5px;color:var(--muted)}
.blur{filter:blur(4px);user-select:none}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat div{padding:14px;border-radius:18px;background:#fff;box-shadow:inset 0 0 0 1px var(--line)}.stat b{display:block;font:800 24px var(--d);color:var(--coral-d)}.stat span{font-size:12.5px;color:var(--muted)}
.ad{border-radius:22px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}.ad .top{display:flex;gap:8px;align-items:center;padding:10px 12px;font-size:13px}.ad .top img{width:28px;border-radius:50%;background:var(--blush);padding:3px}
.ad .vis{background:linear-gradient(160deg,#ff6a63,var(--coral));color:#fff;padding:22px;min-height:240px;display:flex;flex-direction:column;justify-content:space-between}
.ad .vis h3{font:800 26px/1.1 var(--d)}.ad .cap{padding:10px 12px;font-size:13.5px}.ad .btnrow{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--cream);font:600 13px var(--u)}
.mail{border-radius:20px;box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}.mail .mh{padding:12px 14px;background:var(--cream);font-size:12.5px;color:var(--muted)}.mail .mh b{color:var(--ink)}.mail .mb{padding:16px 14px;display:flex;flex-direction:column;gap:10px}
.gift{border-radius:24px;padding:20px;background:linear-gradient(150deg,var(--peach),#fff);box-shadow:inset 0 0 0 1px var(--line);text-align:center}
.center{text-align:center;align-items:center}
.fine{font-size:11.5px;color:var(--muted)}
/* notes */
.notes{display:flex;flex-direction:column;gap:14px}
.ncard{background:#fff;border-radius:22px;padding:20px 22px;box-shadow:0 1px 2px #0000000a}
.ncard h2{font:800 22px/1.2 var(--d);letter-spacing:-.02em}.ncard h3{font:700 13px var(--u);letter-spacing:.06em;text-transform:uppercase;color:var(--coral-d);margin-bottom:6px}
.ncard p,.ncard li{font-size:14.5px}.ncard ul{margin:6px 0 0;padding-left:18px}
.steps{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.steps button{padding:6px 10px;border-radius:999px;background:var(--cream);font:600 12px var(--u);box-shadow:inset 0 0 0 1px var(--line)}.steps button[aria-current=true]{background:var(--coral);color:#fff;box-shadow:none}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;font-size:14px}.kv b{color:var(--muted);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13.5px}th,td{text-align:left;padding:8px 6px;border-top:1px solid var(--line);vertical-align:top}th{font-weight:700;background:var(--cream)}
.sysview{grid-column:2 / 4}@media(max-width:1100px){.sysview{grid-column:auto}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><img src="img/brand-glyph-coral.png" alt="">anacan</div>
    <small>Veb funnel prototipləri · Premium satışı üçün · 24.11.2026</small>
    <div class="nav" id="nav"></div>
  </aside>
  <div class="phone" id="phoneWrap"><div class="scr" id="scr"></div></div>
  <section class="notes" id="notes"></section>
</div>
<script>
'use strict';
const P = { y: 50.98, m: 6.78, by: 16.99, bm: 3.39 }; // AZN: web regular (= $29.99 / $3.99) and Mərcan Cümə
const az = (n) => n.toFixed(2).replace('.', ',') + ' ₼';
const perDay = (y) => (y / 365).toFixed(2).replace('.', ',') + ' ₼';
const IMG = (n) => `img/${n}.webp`;
const REVIEWS = [
  ['Bugünə qədər istifadə etdiyim hamiləlik tətbiqləri içində ən gözəl tətbiqdir, Azərbaycanda yaradılması isə qürurvericidir ❤️', 'App Store'],
  ['Çox bəyəndim. Tövsiyə edirəm. Analar və hamilələr üçün belə bir platformanın olması əladır.', 'Google Play · Yaqut N.'],
];

/* ---------------- funnels ---------------- */
const F = [
{ id: 'quiz', name: 'Şəxsi plan quiz-i', short: 'Reklam → 12 sual → plan → paywall', tag: 'Əsas funnel · bütün il',
  goal: 'Soyuq trafiki (Meta, TikTok) Premium-a çevirmək. Deepstash, Noom və Flo-nun quiz funnel-i Anacan üçün.',
  steps: [
  { t: 'hero', title: 'Hər mərhələ üçün <em>şəxsi plan</em>', sub: '2 dəqiqəlik sual-cavab. Sənin vəziyyətinə uyğun həftəlik plan hazırlayırıq.', proof: true, cta: 'Planımı hazırla',
    n: { why: 'Söz verilən nəticə ("şəxsi plan") tətbiqdən daha cəlbedicidir. Deepstash girişdə tətbiqi yox, "growth plan"ı satır.', metric: 'Başlayanlar / landing (hədəf ≥ 55%)', ref: 'Deepstash growth-plan, Noom' } },
  { t: 'single', key: 'stage', q: 'Hazırda hansı mərhələdəsən?', opts: [['🌸', 'Dövrümü izləyirəm'], ['💞', 'Hamilə olmaq istəyirəm'], ['🤰', 'Hamiləyəm'], ['👶', 'Körpəm var (0–3 yaş)']],
    n: { why: 'Ən vacib seqmentləşdirmə. Sonrakı suallar, plan və paywall mətni bu cavaba görə dəyişir.', metric: 'Seçim paylanması → reklam auditoriyası', ref: 'Flo "Are you pregnant?", Stardust "Choose your journey"' } },
  { t: 'single', key: 'when', q: (a) => a.stage === 'Hamiləyəm' ? 'Neçənci həftədəsən?' : a.stage === 'Körpəm var (0–3 yaş)' ? 'Körpən neçə aylıqdır?' : 'Neçə yaşın var?',
    opts: (a) => a.stage === 'Hamiləyəm' ? [['1️⃣', '1–12 həftə'], ['2️⃣', '13–27 həftə'], ['3️⃣', '28–40 həftə']] : a.stage === 'Körpəm var (0–3 yaş)' ? [['🍼', '0–3 ay'], ['🧸', '4–6 ay'], ['🥣', '7–12 ay'], ['👣', '1–3 yaş']] : [['', '18–24'], ['', '25–34'], ['', '35–44'], ['', '45+']],
    n: { why: 'Rəqəmli cavab sonda "sənin 24-cü həftən" kimi konkret plan göstərməyə imkan verir: personalizasiya hissi satışın əsasıdır.', metric: 'Addım tamamlama (hər sual ≥ 92%)', ref: 'Noom, Flo' } },
  { t: 'multi', key: 'worry', q: 'Səni ən çox nə narahat edir?', sub: 'Bir neçəsini seç', grid: true,
    opts: [['😴', 'Yuxu'], ['🍎', 'Qidalanma'], ['📈', 'İnkişaf normaldırmı?'], ['🩺', 'Həkimə nə soruşum?'], ['😟', 'Əhval, stress'], ['👨‍👩‍👧', 'Ailənin dəstəyi']],
    n: { why: 'Ağrı nöqtələri paywall-da "sənin planına daxildir" siyahısına çevrilir. Çoxseçimli sual daha çox məlumat və daha çox "investisiya" verir.', metric: 'Orta seçim sayı', ref: 'Deepstash "topics", Flo "What can we help you do?"' } },
  { t: 'info', img: 'tumurcuq-value', title: 'Tək deyilsən', text: '46 000-dən çox ailə artıq Anacan-dan istifadə edir. Planında sənin seçdiyin mövzular birinci gəlir.',
    n: { why: 'Sualların arasında "sosial sübut" ekranı yorğunluğu azaldır və inam yaradır. Rəqəm təqdimatdakı real rəqəmdir.', metric: 'Bu ekrandan sonra çıxış (≤ 3%)', ref: 'Noom interstitial-ları, Life Reset' } },
  { t: 'likert', key: 'info', q: 'İnternetdəki məsləhətlər bir-birinə zidd olur və bu məni yorur.',
    n: { why: 'Razılaşma sualı problemi istifadəçinin öz sözü ilə təsdiq etdirir. Sonra həll "etibarlı tək mənbə" kimi təqdim olunur.', metric: 'Orta bal', ref: 'Deepstash likert sualları' } },
  { t: 'likert', key: 'time', q: 'Özümə vaxt ayırmağa çətinliklə imkan tapıram.',
    n: { why: 'Gündə 5 dəqiqəlik plan təklifini əsaslandırır.', metric: 'Orta bal', ref: 'Deepstash' } },
  { t: 'single', key: 'partner', q: 'Həyat yoldaşın da prosesdə iştirak etsin?', opts: [['👫', 'Bəli, birlikdə izləyək'], ['🙂', 'Hələlik yox']],
    n: { why: 'Partnyor rejimi Anacan-ın unikal üstünlüyüdür. "Bəli" deyənlərə paywall-da "2 nəfər, 1 abunəlik" dəyəri göstərilir.', metric: '"Bəli" payı', ref: 'Flo Friends Plan, Stardust "Following my partner"' } },
  { t: 'single', key: 'minutes', q: 'Gündə nə qədər vaxt ayıra bilərsən?', opts: [['🤙', '5 dəqiqə'], ['👌', '10 dəqiqə'], ['🤘', '15 dəqiqə']],
    n: { why: 'Kiçik öhdəlik ("gündə 5 dəqiqə") böyük qərarı (abunəlik) asanlaşdırır.', metric: '-', ref: 'Deepstash "daily learning goal"' } },
  { t: 'loader', title: 'Planın hazırlanır…', bars: ['Mərhələn', 'Narahatlıqların', 'Həftəlik tövsiyələr'], modal: { q: 'Davam etmək üçün: bildirişlərlə xatırlatma istəyirsən?', opts: ['Xeyr', 'Bəli'] },
    n: { why: 'Gözləmə ekranı "zəhmət çəkilib" hissi yaradır. Ortada çıxan sual (Deepstash-də "Do you self-reflect?") istifadəçini aktiv saxlayır və kiçik "bəli"lər zənciri qurur.', metric: 'Loader-dən sonra davam (≥ 95%)', ref: 'Deepstash, Noom "Cross-checking…"' } },
  { t: 'plan', n: { why: 'Ən güclü ekran: cavablardan qurulmuş plan. İstifadəçi artıq "öz planına" sahib olduğunu hiss edir (endowment effect).', metric: 'Plan → e-poçt (≥ 70%)', ref: 'Deepstash "Your growth plan is ready", Life Reset "Based on your answers"' } },
  { t: 'email', n: { why: 'E-poçt satışdan əvvəl alınır: alış olmasa belə, Customer.io ilə 7 günlük ardıcıllıq göndərmək olur. Hesab tətbiqdəki hesabla eynidir.', metric: 'E-poçt alınma (≥ 60%), sonra e-poçtdan satış', ref: 'Deepstash email gate' } },
  { t: 'paywall', mode: 'quiz', n: { why: 'Plan 15 dəqiqə "saxlanılır" (Noom), illik plan əvvəlcədən seçilib və gündəlik qiymətlə göstərilir (gündə 0,14 ₼). Cavablar "planına daxildir" siyahısına çevrilir. Real rəylər, istənilən vaxt ləğv.', metric: 'Paywall → ödəniş (hədəf 6–10%), illik payı', ref: 'Noom 15:00 timer, Flo plan seçimi, Deepstash "Total per day"' } },
  { t: 'checkout', n: { why: 'Ödəniş eyni səhifədə: Epoint (AZN, saxlanılan kart) və ya Dodo (USD). Razılıq qutusu mövcud qaydadır (premium-autorenew-v1).', metric: 'checkout_start → purchase_confirmed', ref: 'Mövcud Mərcan checkout' } },
  { t: 'success', n: { why: 'Satışdan dərhal sonra tətbiqə yönləndirmə və partnyoru dəvət. Partnyor dəvəti pulsuz yeni istifadəçi gətirir.', metric: 'Tətbiqi açma (24 saat ərzində ≥ 80%)', ref: 'Mövcud app keçid səhifəsi' } },
  ] },
{ id: 'bf', name: 'Mərcan Cümə funnel-i', short: 'Reklam → təklif → 1 sual → ödəniş → paylaş', tag: 'Kampaniya · 23–30 noyabr',

function go(d) { si = Math.max(0, Math.min(F[fi].steps.length - 1, si + d)); render(); }
function setF(i) { fi = i; si = 0; ans = {}; plan = 'y'; renderNav(); render(); }
function val(v) { return typeof v === 'function' ? v(ans) : v; }

function renderNav() {
  const nav = document.getElementById('nav');
  nav.innerHTML = F.map((f, i) => `<button aria-pressed="${i === fi}" data-f="${i}"><span class="n">${i + 1}</span><span><b>${f.name}</b><span>${f.short}</span></span></button>`).join('')

  nav.querySelectorAll('button').forEach((b) => b.onclick = () => { const i = +b.dataset.f; if (i === -1) { fi = -1; renderNav(); renderSystem(); } else setF(i); });
}

function topBar(opts = {}) {
  const n = F[fi].steps.length, pct = Math.round((si + 1) / n * 100);
  return `<div class="bar">${si ? '<button class="back" data-back>←</button>' : '<span style="width:34px"></span>'}<div class="prog"><i style="width:${pct}%"></i></div>${opts.close ? '<button class="x" data-close>✕</button>' : '<span style="width:34px"></span>'}</div>`;
}
function screen(body, foot = '', o = {}) { scr.innerHTML = topBar(o) + `<div class="body">${body}</div>` + (foot ? `<div class="foot">${foot}</div>` : ''); wire(); }
function wire() {
  scr.querySelectorAll('[data-back]').forEach((b) => b.onclick = () => go(-1));
  scr.querySelectorAll('[data-next]').forEach((b) => b.onclick = () => go(1));
  scr.querySelectorAll('[data-close]').forEach((b) => b.onclick = () => downsell());
}
