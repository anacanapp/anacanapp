<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Onboarding Bələdçi Turu</title>
<style>
:root{--bg:#ffe7e1;--surface:#fff;--soft:#fdefe6;--ink:#333;--ink-soft:#8c8177;--line:rgba(51,51,51,.09);--coral:#ff5a5f;--coral-ink:#9e2b2e;
--peach1:#ffdcdd;--lav1:#e9ddfc;--green1:#ddf3e3;--green-ink:#1c7a4d;--blue1:#d5edff;--yellow1:#fff2c8;
--page:#f6f1ee;--page-ink:#4a403b;--dim:rgba(25,12,10,.58);
--glass:rgba(255,255,255,.52);--glass-brd:rgba(255,255,255,.75);--glass-hi:rgba(255,255,255,.9);--glass-ink:#2b2523;--glass-soft:rgba(43,37,35,.66)}
:root[data-theme="dark"]{--bg:#161922;--surface:#3b3c41;--soft:#4b4c53;--ink:#fff;--ink-soft:#c7c8ce;--line:rgba(255,255,255,.1);--coral-ink:#ffb3b0;
--peach1:#5a3436;--lav1:#3f3757;--green1:#263f31;--green-ink:#9fe0bb;--blue1:#24384a;--yellow1:#4a3f1e;--page:#101218;--page-ink:#d9d9de;--dim:rgba(0,0,0,.66);
--glass:rgba(28,30,38,.5);--glass-brd:rgba(255,255,255,.16);--glass-hi:rgba(255,255,255,.22);--glass-ink:#fff;--glass-soft:rgba(255,255,255,.72)}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--page-ink);font:15px/1.45 Inter,Nunito,system-ui,-apple-system,sans-serif}
button{font-family:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:18px 16px 40px;display:grid;grid-template-columns:1fr 390px;gap:26px;align-items:start}
@media(max-width:900px){.wrap{grid-template-columns:1fr}.phone-col{order:-1}}
h1{font-size:21px;margin:0 0 4px;letter-spacing:-.02em}.lead{margin:0 0 10px;color:var(--ink-soft);font-size:13.5px}
.lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);margin:12px 0 6px}
.skins{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.skins button{border:1px solid var(--line);background:var(--surface);color:var(--page-ink);border-radius:14px;padding:10px 6px;font-size:12px;cursor:pointer;text-align:center;line-height:1.3}
.skins button b{display:block;font-size:14px;margin-bottom:2px}
.skins button[aria-pressed="true"]{border-color:var(--coral);box-shadow:0 0 0 3px rgba(255,90,95,.16)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:var(--page-ink);font-size:12.5px;padding:6px 11px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--coral);color:#fff}
.flow{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-top:12px;font-size:13px}
.flow ol{margin:6px 0 0;padding-left:20px}.flow>ol>li{margin:6px 0;cursor:pointer}.flow li.cur{color:var(--coral-ink);font-weight:600}
.flow ul{margin:3px 0 0;padding-left:14px;font-weight:400;color:var(--ink-soft);font-size:12px;list-style:"– "}
.flow ul li.cur{color:var(--coral-ink)}
.logic{margin-top:10px;font-size:12.5px;color:var(--ink-soft)}.logic div{padding:5px 0;border-top:1px dashed var(--line)}.logic b{color:var(--page-ink)}
.nav{display:flex;gap:8px;justify-content:center;margin-top:12px}
.btn{border:0;border-radius:999px;padding:11px 18px;font-weight:600;font-size:14px;cursor:pointer}.btn.primary{background:var(--coral);color:#fff}.btn.ghost{background:var(--surface);color:var(--page-ink);border:1px solid var(--line)}
/* phone + app mock */
.phone{position:relative;width:375px;max-width:100%;height:760px;margin:0 auto;border-radius:46px;overflow:hidden;border:10px solid #1d1d1f;box-shadow:0 30px 60px -30px rgba(0,0,0,.45);background:var(--bg)}
.phone.glassy{background:radial-gradient(120% 60% at 10% 0%,#ffd0c4 0%,transparent 60%),radial-gradient(90% 50% at 100% 30%,#e7d4ff 0%,transparent 60%),radial-gradient(90% 60% at 30% 100%,#ffe9b8 0%,transparent 60%),var(--bg)}
:root[data-theme="dark"] .phone.glassy{background:radial-gradient(120% 60% at 10% 0%,#5a2f3a 0%,transparent 60%),radial-gradient(90% 50% at 100% 30%,#3a2f5e 0%,transparent 60%),radial-gradient(90% 60% at 30% 100%,#4a3a1e 0%,transparent 60%),var(--bg)}
.status{height:44px;display:flex;justify-content:space-between;align-items:center;padding:0 26px;font-size:13px;font-weight:600;color:var(--ink);position:relative;z-index:50}
.screen{position:absolute;inset:44px 0 0 0;overflow:hidden;color:var(--ink)}
.app{position:absolute;inset:0;padding:4px 16px 100px;overflow:hidden;animation:slide .35s}
.glassy .card,.glassy .qk div,.glassy .tile,.glassy .post,.glassy .bubble:not(.me),.glassy .apphead .back{background:rgba(255,255,255,.62);backdrop-filter:blur(14px)}
:root[data-theme="dark"] .glassy .card,:root[data-theme="dark"] .glassy .qk div,:root[data-theme="dark"] .glassy .tile,:root[data-theme="dark"] .glassy .post,:root[data-theme="dark"] .glassy .bubble:not(.me){background:rgba(59,60,65,.6)}
.hello{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 12px}.hello small{display:block;color:var(--ink-soft);font-size:12px}.hello b{font-size:19px;letter-spacing:-.02em}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#ffd0c4,#ff8d89)}
.apphead{display:flex;align-items:center;gap:10px;margin:2px 0 12px}.apphead .back{width:36px;height:36px;border-radius:12px;background:var(--surface);display:grid;place-items:center;font-size:18px}
.apphead small{display:block;font-size:11.5px;color:var(--ink-soft)}.apphead b{font-size:18px;letter-spacing:-.02em}
.card{background:var(--surface);border-radius:22px;padding:14px;margin-bottom:10px}
.hero{background:linear-gradient(135deg,#ffe4e2 0%,#ffb4b1 52%,#ff8d89 100%)!important;color:#5a1f1f}
:root[data-theme="dark"] .hero{background:linear-gradient(135deg,#5a3436,#a8454a)!important;color:#fff}
.hero .k{font-size:12px;opacity:.8}.hero .t{font-size:20px;font-weight:700;letter-spacing:-.02em;margin:3px 0 5px}.hero .s{font-size:12.5px;opacity:.9}
.qk{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}.qk div{background:var(--surface);border-radius:18px;padding:10px 3px;text-align:center;font-size:11px}
.ic{display:grid;place-items:center;width:38px;height:38px;margin:0 auto 5px;border-radius:12px;font-style:normal;font-size:18px}
.sec{font-size:12px;font-weight:700;color:var(--ink-soft);margin:6px 2px 7px;display:flex;justify-content:space-between}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.tile{background:var(--surface);border-radius:18px;padding:11px 5px;text-align:center;font-size:11.5px;line-height:1.25;min-height:82px;position:relative}
.tile.lock{opacity:.42}.tile.lock::after{content:"🔒";position:absolute;right:6px;top:5px;font-size:11px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.opts button{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:16px;padding:11px 3px;font-size:12.5px;cursor:pointer}
.opts button.on{border-color:var(--coral);background:var(--peach1)}.opts i{display:block;font-style:normal;font-size:22px;margin-bottom:2px}
.listrow{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:13px}.listrow:first-child{border-top:0}
.listrow i{font-style:normal;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--soft)}
.listrow span small{display:block;color:var(--ink-soft);font-size:11.5px}
.bubble{background:var(--surface);border-radius:18px 18px 18px 6px;padding:10px 13px;margin:0 46px 8px 0;font-size:13px}
.bubble.me{background:var(--coral);color:#fff;border-radius:18px 18px 6px 18px;margin:0 0 8px 70px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 8px}.chips span{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 11px;font-size:12px}
.post{background:var(--surface);border-radius:18px;padding:12px;margin-bottom:8px;font-size:13px}
.post .u{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--ink-soft);margin-bottom:6px}.post .u i{width:26px;height:26px;border-radius:50%;background:var(--lav1)}
.post .r{display:flex;gap:14px;font-size:12px;color:var(--ink-soft);margin-top:8px}
.big{display:grid;place-items:center;width:150px;height:150px;margin:8px auto;border-radius:50%;background:var(--peach1);font-size:42px;font-weight:700;color:var(--coral-ink)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;font-size:11px;text-align:center}.cal span{padding:6px 0;border-radius:8px}.cal .p{background:var(--peach1);color:var(--coral-ink);font-weight:700}.cal .o{background:var(--lav1)}.cal .t{outline:2px solid var(--coral)}
.tabbar{position:absolute;left:14px;right:14px;bottom:16px;height:60px;border-radius:30px;background:rgba(255,255,255,.9);backdrop-filter:blur(22px) saturate(180%);display:flex;justify-content:space-around;align-items:center;box-shadow:0 10px 30px -12px rgba(0,0,0,.25);z-index:5}
:root[data-theme="dark"] .tabbar{background:rgba(59,60,65,.82)}
.tabbar span{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--ink-soft)}.tabbar span.on{background:var(--soft);color:var(--coral)}.tabbar svg{width:21px;height:21px}
/* overlay */
.ov{position:absolute;inset:0;z-index:30;pointer-events:none}
.hole{position:absolute;border-radius:20px;box-shadow:0 0 0 2400px var(--dim);transition:all .45s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.hole.round{border-radius:50%}
.hole::after{content:"";position:absolute;inset:-6px;border-radius:inherit;border:2px solid rgba(255,255,255,.95);animation:pulse 1.6s infinite}
.tap{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(255,255,255,.35);border:2px solid #fff;pointer-events:none;animation:tap 1.4s infinite;transition:all .45s}
.coach{position:absolute;left:14px;right:14px;pointer-events:auto;animation:up .35s;z-index:31}
.coach .where{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:999px;margin-bottom:8px}
.coach .h{font-size:17px;font-weight:700;letter-spacing:-.02em;margin:0 0 4px;line-height:1.25}
.coach .p{margin:0 0 12px;font-size:13.5px}
.coach .a{display:flex;align-items:center;justify-content:space-between;gap:8px}
.coach .skip{border:0;background:none;font-size:13px;cursor:pointer;padding:6px 0}
.coach .go{border:0;border-radius:14px;padding:11px 18px;font-weight:600;font-size:14px;cursor:pointer}
.mini{display:flex;gap:4px}.mini i{width:6px;height:6px;border-radius:3px;background:currentColor;opacity:.25}.mini i.on{width:16px;opacity:1}
.perm{margin:10px 0 12px;border-radius:16px;padding:12px}
.perm b{display:block;font-size:14px;margin-bottom:2px}.perm p{margin:0 0 9px;font-size:12.5px}
.perm .two{display:flex;gap:8px}.perm .two button{flex:1;border:0;border-radius:12px;padding:10px;font-weight:600;font-size:13px;cursor:pointer}
/* full cards */
.full{position:absolute;inset:0;z-index:32;display:flex;flex-direction:column;justify-content:flex-end;pointer-events:auto;animation:fade .3s}
.full .panel{margin:0 12px 16px;border-radius:30px;padding:22px 20px 20px}
.full .kick{font-size:12px;font-weight:600;margin-bottom:4px}
.full h2{margin:0 0 6px;font-size:24px;letter-spacing:-.03em;line-height:1.15}
.full .p{margin:0 0 14px;font-size:14px}
.full .items{display:grid;gap:7px;margin:0 0 16px}
.full .items div{display:flex;gap:10px;align-items:center;border-radius:14px;padding:9px 11px;font-size:13px}
.full .items i{font-style:normal;flex:0 0 30px;height:30px;border-radius:10px;display:grid;place-items:center}
.full .items small{display:block;font-size:11.5px;opacity:.75}
.full .cta{width:100%;border:0;border-radius:16px;padding:15px;font-weight:700;font-size:15px;cursor:pointer}
.full .sec{display:block;margin:10px auto 0;border:0;background:none;font-size:13.5px;cursor:pointer}
.full .art{flex:1;display:grid;place-items:center;font-size:84px}
.badge{display:inline-flex;gap:6px;align-items:center;padding:5px 11px;border-radius:999px;background:linear-gradient(135deg,#ffe7a3,#f6c453);color:#6a4500;font-size:12px;font-weight:700;margin-bottom:8px}
/* SKIN: glass */
.sk-glass .hole{box-shadow:0 0 0 2400px rgba(40,20,30,.34)}:root[data-theme="dark"] .sk-glass .hole{box-shadow:0 0 0 2400px rgba(0,0,0,.5)}
.sk-glass .coach,.sk-glass .full .panel{background:var(--glass);backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);border:1px solid var(--glass-brd);box-shadow:inset 0 1px 0 var(--glass-hi),0 24px 48px -24px rgba(0,0,0,.45);color:var(--glass-ink);border-radius:26px;padding:16px}
.sk-glass .full .panel{border-radius:32px;padding:22px 20px}
.sk-glass .coach .p,.sk-glass .full .p,.sk-glass .coach .skip,.sk-glass .full .sec{color:var(--glass-soft)}
.sk-glass .coach .where{background:rgba(255,255,255,.55);color:var(--coral-ink);border:1px solid var(--glass-brd)}:root[data-theme="dark"] .sk-glass .coach .where{background:rgba(255,255,255,.12)}
.sk-glass .coach .go,.sk-glass .full .cta{background:linear-gradient(135deg,rgba(255,110,114,.95),rgba(255,90,95,.95));color:#fff;box-shadow:0 10px 22px -10px rgba(255,90,95,.8),inset 0 1px 0 rgba(255,255,255,.45)}
.sk-glass .perm,.sk-glass .full .items div{background:rgba(255,255,255,.42);border:1px solid var(--glass-brd)}:root[data-theme="dark"] .sk-glass .perm,:root[data-theme="dark"] .sk-glass .full .items div{background:rgba(255,255,255,.08)}
.sk-glass .full .items i,.sk-glass .perm .two .n{background:rgba(255,255,255,.6);color:var(--glass-ink)}:root[data-theme="dark"] .sk-glass .full .items i,:root[data-theme="dark"] .sk-glass .perm .two .n{background:rgba(255,255,255,.14)}
.sk-glass .perm .two .y{background:var(--coral);color:#fff}
.sk-glass .full{background:rgba(255,231,225,.18);backdrop-filter:blur(10px)}:root[data-theme="dark"] .sk-glass .full{background:rgba(10,10,16,.3)}
.sk-glass .full .art span{filter:drop-shadow(0 16px 24px rgba(0,0,0,.18))}
/* SKIN: calm (solid) */
.sk-calm .coach,.sk-calm .full .panel{background:var(--surface);color:var(--ink);border-radius:22px;padding:15px;box-shadow:0 22px 44px -22px rgba(0,0,0,.45)}
.sk-calm .full .panel{border-radius:28px 28px 28px 28px;padding:22px 20px}
.sk-calm .coach .p,.sk-calm .full .p,.sk-calm .coach .skip,.sk-calm .full .sec{color:var(--ink-soft)}
.sk-calm .coach .where{background:var(--soft);color:var(--coral-ink)}
.sk-calm .coach .go,.sk-calm .full .cta{background:var(--coral);color:#fff}
.sk-calm .perm,.sk-calm .full .items div{background:var(--soft)}.sk-calm .full .items i,.sk-calm .perm .two .n{background:var(--surface);color:var(--ink)}.sk-calm .perm .two .y{background:var(--coral);color:#fff}
.sk-calm .full{background:var(--dim)}
.sk-calm .coach.top::after,.sk-calm .coach.bottom::before{content:"";position:absolute;left:var(--ax,50%);width:16px;height:16px;background:var(--surface);transform:translateX(-50%) rotate(45deg)}
.sk-calm .coach.top::after{bottom:-7px}.sk-calm .coach.bottom::before{top:-7px}
/* SKIN: bold */
.sk-bold .hole{box-shadow:0 0 0 2400px rgba(30,10,12,.66)}
.sk-bold .coach{left:0;right:0;bottom:0!important;top:auto!important;border-radius:30px 30px 0 0;background:var(--coral);color:#fff;padding:18px 20px 26px}
.sk-bold .coach .h{font-size:21px}.sk-bold .coach .p{color:rgba(255,255,255,.9)}
.sk-bold .coach .where{background:rgba(255,255,255,.2);color:#fff}
.sk-bold .coach .skip{color:rgba(255,255,255,.85)}.sk-bold .coach .go{background:#fff;color:var(--coral-ink)}
.sk-bold .perm{background:rgba(255,255,255,.16)}.sk-bold .perm .two .n{background:rgba(255,255,255,.2);color:#fff}.sk-bold .perm .two .y{background:#fff;color:var(--coral-ink)}
.sk-bold .full{background:var(--coral);justify-content:flex-start}.sk-bold .full .panel{color:#fff;margin:0;padding:6px 22px 26px}
.sk-bold .full .art{flex:0 0 46%}.sk-bold .full h2{font-size:30px}.sk-bold .full .p,.sk-bold .full .sec{color:rgba(255,255,255,.9)}
.sk-bold .full .items div{background:rgba(255,255,255,.16)}.sk-bold .full .items i{background:rgba(255,255,255,.22)}
.sk-bold .full .cta{background:#fff;color:var(--coral-ink)}
.sk-bold .coach.up{top:0!important;bottom:auto!important;border-radius:0 0 30px 30px;padding-top:14px}
/* SKIN: ai guide */
.sk-ai .coach{display:flex;gap:10px;align-items:flex-end;background:none;padding:0}
.sk-ai .coach .av{flex:0 0 42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#ffb4b1,#ff5a5f);display:grid;place-items:center;color:#fff;font-size:18px;box-shadow:0 8px 18px -8px rgba(255,90,95,.8)}
.sk-ai .coach .bub{flex:1;background:var(--surface);color:var(--ink);border-radius:22px 22px 22px 6px;padding:13px 14px;box-shadow:0 22px 44px -22px rgba(0,0,0,.5)}
.sk-ai .coach .p,.sk-ai .coach .skip{color:var(--ink-soft)}.sk-ai .coach .where{background:var(--soft);color:var(--coral-ink)}
.sk-ai .coach .go{background:var(--coral);color:#fff;border-radius:999px}
.sk-ai .perm{background:var(--soft)}.sk-ai .perm .two .n{background:var(--surface);color:var(--ink)}.sk-ai .perm .two .y{background:var(--coral);color:#fff}
.sk-ai .full{background:var(--dim)}.sk-ai .full .panel{background:var(--surface);color:var(--ink);border-radius:28px}
.sk-ai .full .p,.sk-ai .full .sec{color:var(--ink-soft)}.sk-ai .full .items div{background:var(--soft)}.sk-ai .full .items i{background:var(--surface)}.sk-ai .full .cta{background:var(--coral);color:#fff}
.gold{background:linear-gradient(135deg,#ffe7a3,#f6c453)!important;color:#5a3a00!important}
.toast{position:absolute;left:16px;right:16px;top:12px;z-index:60;background:var(--ink);color:var(--bg);border-radius:16px;padding:11px 14px;font-size:12.5px;animation:up .3s}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(14px);opacity:0}}@keyframes slide{from{transform:translateX(18px);opacity:.3}}
@keyframes pulse{50%{opacity:.25}}@keyframes tap{0%{transform:scale(.7);opacity:1}80%{transform:scale(1.5);opacity:0}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<section>
  <h1>Bələdçi turu: real ekranlarda, alətlərin içində</h1>
  <p class="lead">Tur istifadəçini həqiqətən aparır: tab-a basır, alət açılır, yuxarıda "Siz buradasınız" göstərilir. İşıqlanan yerə basmaq da "Növbəti" kimi işləyir.</p>
  <div class="lbl">Dizayn stili</div>
  <div class="skins" id="skins"></div>
  <div class="lbl">İstifadəçi</div>
  <div class="row">
    <div class="seg" data-k="mode"><button data-v="mommy">Ana</button><button data-v="bump">Hamilə</button><button data-v="flow">Dövr</button></div>
    <div class="seg" data-k="tier"><button data-v="free">Free</button><button data-v="premium">Premium</button></div>
  </div>
  <div class="row"><div class="seg" data-k="push"><button data-v="prompt">Push: soruşulmayıb</button><button data-v="granted">icazə var</button><button data-v="denied">rədd edilib</button></div></div>
  <div class="row"><div class="seg" data-k="region"><button data-v="az">Azərbaycan (az)</button><button data-v="other">Digər</button></div><div class="seg" data-k="theme"><button data-v="light">Light</button><button data-v="dark">Dark</button></div></div>
  <div class="flow" id="flow"></div>
</section>
<section class="phone-col">
  <div class="phone" id="phone"><div class="status"><span>9:41</span><span>●●● 100%</span></div><div class="screen" id="screen"></div></div>
  <div class="nav"><button class="btn ghost" id="prev">← Geri</button><button class="btn primary" id="next">Növbəti →</button></div>
</section>
</div>
<script>
const FREE_AI_PER_DAY=10; // real app: app_settings.free_limits.ai_chat_count_per_day

function fullHTML(kind){const m=MODE[S.mode];
 if(kind==='welcome')return `<div class="full">${S.skin==='bold'?'<div class="art"><span>🌷</span></div>':'<div class="art"><span>🌷</span></div>'}<div class="panel"><div class="kick" style="color:var(--coral-ink)">${S.skin==='bold'?'<span style="color:#fff;opacity:.85">Planın hazırdır</span>':'Planın hazırdır'}</div><h2>Xoş gəldin, ${m.name}!</h2><p class="p">Sənə 4 yeri göstərək: ilk qeyd, alətlər, Anacan AI və İcma. Təxminən 40 saniyə.</p><button class="cta" data-act="next">Başlayaq</button><button class="sec" data-act="close">Sonra, özüm baxaram</button></div></div>`;
 return `<div class="full"><div class="art"><span>👑</span></div><div class="panel"><span class="badge">👑 Anacan Premium</span><h2>Daha çoxunu açın</h2><p class="p">Pulsuz plan sizində qalır. Premium ilə əlavə olaraq:</p><div class="items">${PREMBEN[S.mode].map(b=>`<div><i>${b[0]}</i><span>${b[1]}<small>${b[2]}</small></span></div>`).join('')}</div><button class="cta gold" data-act="paywall">Premium-a bax</button><button class="sec" data-act="next">Pulsuz davam et</button></div></div>`;}
function endHTML(){const l=checklist(),n=l.filter(x=>x[1]).length;
 return screen('home').replace('<div class="card" style="height:84px"></div><div class="card" style="height:84px"></div>',`<div class="card"><b>Başlanğıc</b><div style="font-size:12px;color:var(--ink-soft)">${n} / ${l.length} tamamlandı</div><div style="height:6px;border-radius:3px;background:var(--soft);margin:8px 0;overflow:hidden"><i style="display:block;height:100%;width:${n/l.length*100}%;background:var(--coral)"></i></div>${l.map(x=>`<div class="listrow"><i style="${x[1]?'background:var(--green-ink);color:#fff':''}">${x[1]?'✓':'○'}</i><span style="${x[1]?'color:var(--ink-soft);text-decoration:line-through':''}">${x[0]}</span></div>`).join('')}</div>`);}
/* ---------- render ---------- */
function render(){const P=plan();if(S.si>=P.length)S.si=P.length-1;const st=P[S.si];if(S.ui>=st.subs.length)S.ui=st.subs.length-1;const sub=st.subs[S.ui];
 const phone=document.getElementById('phone');phone.className='phone '+(S.skin==='glass'?'glassy ':'')+'sk-'+S.skin;
 const scr=document.getElementById('screen');
 if(S.done){scr.innerHTML=endHTML();}
 else if(sub.full){scr.innerHTML=screen(sub.screen)+fullHTML(sub.full);}
 else{scr.innerHTML=screen(sub.screen)+'<div class="ov" id="ov"></div>';
  requestAnimationFrame(()=>{const r=rectOf(sub.target);const ov=document.getElementById('ov');if(!ov)return;
   const pad=sub.round?4:6,R=r?{l:r.l-pad,t:r.t-pad,w:r.w+pad*2,h:r.h+pad*2}:{l:0,t:0,w:0,h:0};
   const below=R.t+R.h<380;const H=document.getElementById('screen').clientHeight;
   const lowTarget=R.t>H-170;const coachPos=S.skin==='bold'?'':below?`top:${Math.min(R.t+R.h+16,H-300)}px`:`bottom:${Math.max(H-R.t+16,18)}px`;
   const ax=Math.min(Math.max(R.l+R.w/2-14,24),330);
   ov.innerHTML=`<div class="hole ${sub.round?'round':''}" style="left:${R.l}px;top:${R.t}px;width:${R.w}px;height:${R.h}px"></div>${sub.tap?`<div class="tap" style="left:${R.l+R.w/2}px;top:${R.t+R.h/2}px"></div>`:''}<div class="coach ${below?'bottom':'top'} ${S.skin==='bold'&&lowTarget?'up':''}" style="${coachPos};--ax:${ax}px">${coachHTML(sub,S.si,P.length,S.ui,st.subs.length)}</div>`;});}
 document.getElementById('skins').innerHTML=SKINS.map(s=>`<button aria-pressed="${S.skin===s[0]}" data-skin="${s[0]}"><b>${s[1]}</b>${s[2]}</button>`).join('');
 document.getElementById('flow').innerHTML=`<b>Bu istifadəçi üçün: ${P.length} addım</b><ol>${P.map((s,i)=>`<li class="${i===S.si&&!S.done?'cur':''}" data-go="${i}">${s.t}${s.subs.length>1?`<ul>${s.subs.map((u,k)=>`<li class="${i===S.si&&k===S.ui&&!S.done?'cur':''}">${u.where||u.h||''}</li>`).join('')}</ul>`:''}</li>`).join('')}<li class="${S.done?'cur':''}" data-go="end">Ana ekran: Başlanğıc siyahısı</li></ol><div class="logic">${notes(P).map(x=>`<div>${x}</div>`).join('')}</div>`;
 document.querySelectorAll('.seg').forEach(g=>g.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',S[g.dataset.k]===b.dataset.v)));
 document.documentElement.dataset.theme=S.theme;}
function notes(P){const n=[];
 n.push(`<b>Push:</b> ${S.pushAsked?'"İndi yox" deyildi, bu sessiyada bir daha soruşulmur; 3 gün sonra kontekstdə 1 dəfə.':S.push==='prompt'?'soruşulmayıb: ilk qeydin nəticəsində 1 dəfə yumşaq sorğu, "Bəli" olsa sistem pəncərəsi.':S.push==='granted'?'icazə var: heç bir sorğu yoxdur.':'rədd edilib: sistem yenidən soruşmur, turda sorğu yoxdur; siyahıda "Ayarlardan aç".'}`);
 n.push(`<b>İlk qeyd:</b> ${T[logTool()].n} (${premium()?'Premium aləti':'pulsuz alət, paywall açılmır'}).`);
 n.push(`<b>Açılan alətlər:</b> ${feat().map(id=>T[id].n).join(', ')}. ${premium()?'':'Kilidli alət açılmır və "sizdə var" deyilmir.'}`);
 n.push(`<b>Region:</b> ${S.region==='az'&&S.mode!=='flow'?'Tortlar və PDF kitablar siyahıda var.':'Tortlar və PDF kitablar göstərilmir.'}`);
 n.push(`<b>Premium addımı:</b> ${premium()?'yoxdur (artıq Premium).':'var, qiymətsiz, "Pulsuz davam et" ilə.'}`);
 return n;}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.getElementById('screen').appendChild(d);setTimeout(()=>d.remove(),2600);}
function next(){const P=plan();const st=P[S.si];if(S.ui<st.subs.length-1)S.ui++;else if(S.si<P.length-1){S.si++;S.ui=0;}else S.done=true;render();}
function prev(){if(S.done){S.done=false;}else if(S.ui>0)S.ui--;else if(S.si>0){S.si--;S.ui=plan()[S.si].subs.length-1;}render();}
function reset(){S.si=0;S.ui=0;S.logged=false;S.pushAsked=false;S.done=false;}
document.addEventListener('click',e=>{
 const sk=e.target.closest('[data-skin]');if(sk){S.skin=sk.dataset.skin;reset();return render();}
 const go=e.target.closest('[data-go]');if(go){if(go.dataset.go==='end')S.done=true;else{S.done=false;S.si=+go.dataset.go;S.ui=0;}return render();}
 const sg=e.target.closest('.seg button');if(sg){S[sg.parentNode.dataset.k]=sg.dataset.v;if(sg.parentNode.dataset.k!=='theme')reset();return render();}
 const a=e.target.closest('[data-act]');
 if(a){const act=a.dataset.act;
  if(act==='logpick'){S.logged=true;return render();}
  if(act==='pushyes'){S.push='granted';toast('Sistem icazə pəncərəsi açılır (iOS / Android). Nəticə hesabda qeyd olunur.');return setTimeout(next,600);}
  if(act==='pushno'){S.pushAsked=true;toast('Yaxşı. Bu sessiyada bir daha soruşmayacağıq.');return setTimeout(next,600);}
  if(act==='paywall'){return toast('Mövcud paywall açılır (real store qiymətləri ilə).');}
  if(act==='close'){S.done=true;toast('Tur bağlandı. Qalanlar "Başlanğıc" siyahısındadır.');return render();}
  if(act==='next')return next();}
 /* tapping the highlighted target works like the tour's own "next" */
 const P=plan();const sub=!S.done&&P[S.si].subs[S.ui];
 if(sub&&sub.tap){const tgt=e.target.closest('#screen [data-tour]');if(tgt&&tgt.dataset.tour===sub.target)return next();}});
document.getElementById('prev').onclick=prev;
document.getElementById('next').onclick=()=>{if(S.done){reset();render();}else{const P=plan(),sub=P[S.si].subs[S.ui];if(sub.log&&!S.logged){S.logged=true;render();}else next();}};
render();
</script>
</body>
</html>
