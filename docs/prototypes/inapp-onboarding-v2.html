<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Onboarding Dizayn Seçimləri</title>
<style>
:root{--bg:#ffe7e1;--surface:#fff;--soft:#fdefe6;--ink:#333;--ink-soft:#8c8177;--line:rgba(51,51,51,.09);--coral:#ff5a5f;--coral-ink:#9e2b2e;
--peach1:#ffdcdd;--lav1:#e9ddfc;--green1:#ddf3e3;--green-ink:#1c7a4d;--blue1:#d5edff;--yellow1:#fff2c8;--gold:#f6c453;
--page:#f6f1ee;--page-ink:#4a403b;--shade:rgba(25,12,10,.6);--bubble:#fff}
:root[data-theme="dark"]{--bg:#161922;--surface:#3b3c41;--soft:#4b4c53;--ink:#fff;--ink-soft:#c7c8ce;--line:rgba(255,255,255,.1);--coral-ink:#ffb3b0;
--peach1:#5a3436;--lav1:#3f3757;--green1:#263f31;--green-ink:#9fe0bb;--blue1:#24384a;--yellow1:#4a3f1e;--page:#101218;--page-ink:#d9d9de;--shade:rgba(0,0,0,.7);--bubble:#3b3c41}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--page-ink);font:15px/1.45 Inter,Nunito,system-ui,-apple-system,sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:18px 16px 40px;display:grid;grid-template-columns:1fr 390px;gap:26px;align-items:start}
@media(max-width:880px){.wrap{grid-template-columns:1fr}.phone-col{order:-1}}
h1{font-size:21px;margin:0 0 4px;letter-spacing:-.02em}
.lead{margin:0 0 12px;color:var(--ink-soft);font-size:13.5px}
.lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);margin:12px 0 6px}
.designs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.designs button{border:1px solid var(--line);background:var(--surface);color:var(--page-ink);border-radius:14px;padding:9px 6px;font:inherit;font-size:12.5px;cursor:pointer;text-align:center}
.designs button b{display:block;font-size:15px}
.designs button[aria-pressed="true"]{border-color:var(--coral);box-shadow:0 0 0 3px rgba(255,90,95,.16)}
.row{display:flex;flex-wrap:wrap;gap:8px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:var(--page-ink);font:inherit;font-size:12.5px;padding:6px 11px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--coral);color:#fff}
.flow{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-top:12px}
.flow ol{margin:6px 0 0;padding-left:20px}.flow li{margin:4px 0;font-size:13.5px;cursor:pointer}
.flow li.cur{color:var(--coral-ink);font-weight:600}
.flow .meta{font-size:12.5px;color:var(--ink-soft)}
.logic{margin-top:10px;font-size:12.5px;color:var(--ink-soft)}
.logic div{padding:5px 0;border-top:1px dashed var(--line)}
.logic b{color:var(--page-ink)}
.nav{display:flex;gap:8px;justify-content:center;margin-top:12px}
.btn{border:0;border-radius:999px;padding:11px 18px;font:600 14px/1 inherit;font-family:inherit;cursor:pointer}
.btn.primary{background:var(--coral);color:#fff}.btn.ghost{background:var(--surface);color:var(--page-ink);border:1px solid var(--line)}
/* phone */
.phone{position:relative;width:375px;max-width:100%;height:760px;margin:0 auto;border-radius:44px;background:var(--bg);overflow:hidden;border:10px solid #1d1d1f;box-shadow:0 30px 60px -30px rgba(0,0,0,.45)}
.status{height:44px;display:flex;justify-content:space-between;align-items:center;padding:0 26px;font-size:13px;font-weight:600;color:var(--ink);position:relative;z-index:40}
.screen{position:absolute;inset:44px 0 0 0;overflow:hidden;color:var(--ink)}
.pad{padding:6px 16px 110px;height:100%;overflow:hidden}
.hello{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 12px}
.hello small{display:block;color:var(--ink-soft);font-size:12px}.hello b{font-size:19px;letter-spacing:-.02em}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#ffd0c4,#ff8d89)}
.card{background:var(--surface);border-radius:22px;padding:15px;margin-bottom:11px}
.hero{background:linear-gradient(135deg,#ffe4e2 0%,#ffb4b1 52%,#ff8d89 100%);color:#5a1f1f}
:root[data-theme="dark"] .hero{background:linear-gradient(135deg,#5a3436,#a8454a);color:#fff}
.hero .k{font-size:12px;opacity:.8}.hero .t{font-size:21px;font-weight:700;letter-spacing:-.02em;margin:3px 0 5px}.hero .s{font-size:12.5px;opacity:.9}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:11px}
.quick div{background:var(--surface);border-radius:18px;padding:11px 3px;text-align:center;font-size:11px}
.ic{display:grid;place-items:center;width:38px;height:38px;margin:0 auto 5px;border-radius:12px;font-style:normal;font-size:18px}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tgrid div{background:var(--surface);border-radius:18px;padding:12px 6px;text-align:center;font-size:11.5px;line-height:1.25;min-height:86px}
.tabbar{position:absolute;left:14px;right:14px;bottom:16px;height:60px;border-radius:30px;background:rgba(255,255,255,.9);backdrop-filter:blur(20px);display:flex;justify-content:space-around;align-items:center;box-shadow:0 10px 30px -12px rgba(0,0,0,.25);z-index:5}
:root[data-theme="dark"] .tabbar{background:rgba(59,60,65,.88)}
.tabbar span{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink-soft)}.tabbar span.on{background:var(--soft);color:var(--coral)}
.tabbar svg{width:21px;height:21px}
.bubble{background:var(--bubble);border-radius:18px 18px 18px 6px;padding:10px 13px;margin:0 50px 8px 0;font-size:13.5px}
.bubble.me{background:var(--coral);color:#fff;border-radius:18px 18px 6px 18px;margin:0 0 8px 70px}
.post{background:var(--surface);border-radius:18px;padding:12px;margin-bottom:9px;font-size:13px}
.post .u{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--ink-soft);margin-bottom:6px}.post .u i{width:24px;height:24px;border-radius:50%;background:var(--lav1)}
/* shared content blocks */
.kick{font-size:11.5px;color:var(--ink-soft);margin-bottom:4px}
.h{font-size:21px;font-weight:700;letter-spacing:-.02em;margin:0 0 6px;line-height:1.2}
.p{margin:0 0 14px;color:var(--ink-soft);font-size:13.5px}
.items{display:grid;gap:7px;margin:4px 0 16px}
.items div{display:flex;gap:10px;align-items:center;background:var(--soft);border-radius:14px;padding:9px 11px;font-size:13px}
.items i{font-style:normal;flex:0 0 30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--surface)}
.items small{display:block;color:var(--ink-soft);font-size:11.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}.chips span{background:var(--soft);border-radius:999px;padding:6px 11px;font-size:12px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 14px}
.opts button{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:16px;padding:12px 3px;font:inherit;font-size:12.5px;cursor:pointer}
.opts button.on{border-color:var(--coral);background:var(--peach1)}.opts i{display:block;font-style:normal;font-size:22px;margin-bottom:3px}
.full{width:100%;border:0;border-radius:16px;padding:14px;font:600 15px/1 inherit;font-family:inherit;cursor:pointer;background:var(--coral);color:#fff}
.full.gold{background:linear-gradient(135deg,#ffe7a3,#f6c453);color:#5a3a00}
.link{display:block;margin:10px auto 0;border:0;background:none;color:var(--ink-soft);font:inherit;font-size:13px;cursor:pointer}
.perm{margin:4px 0 12px;background:var(--soft);border-radius:16px;padding:12px;text-align:left}
.perm b{display:block;font-size:14px;margin-bottom:2px}.perm p{margin:0 0 9px;font-size:12.5px;color:var(--ink-soft)}
.perm .two{display:flex;gap:8px}.perm .two button{flex:1;border:0;border-radius:12px;padding:10px;font:600 13px/1 inherit;font-family:inherit;cursor:pointer}
.perm .y{background:var(--coral);color:#fff}.perm .n{background:var(--surface);color:var(--ink)}
.okc{width:60px;height:60px;border-radius:50%;margin:0 auto 10px;background:var(--green1);color:var(--green-ink);display:grid;place-items:center;font-size:28px;animation:pop .45s}
.badge{display:inline-flex;gap:6px;align-items:center;padding:5px 11px;border-radius:999px;background:linear-gradient(135deg,#ffe7a3,#f6c453);color:#6a4500;font-size:12px;font-weight:700;margin-bottom:8px}
.dots{display:flex;gap:5px;justify-content:center;margin:0 0 12px}.dots i{width:6px;height:6px;border-radius:3px;background:var(--line)}.dots i.on{width:18px;background:var(--coral)}
/* A sheet */
.shade{position:absolute;inset:0;background:var(--shade);z-index:20;animation:fade .25s}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:22;background:var(--surface);border-radius:28px 28px 0 0;padding:20px 20px 28px;max-height:88%;overflow:auto;animation:up .3s}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:-6px auto 12px}
/* B story */
.story{position:absolute;inset:0;z-index:22;display:flex;flex-direction:column;background:var(--surface)}
.story .bars{display:flex;gap:4px;padding:8px 16px 0}.story .bars i{flex:1;height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.story .bars i.done{background:var(--coral)}.story .bars i.on{background:linear-gradient(90deg,var(--coral) 55%,var(--line) 55%)}
.story .art{flex:0 0 44%;margin:12px 16px 0;border-radius:28px;display:grid;place-items:center;position:relative;overflow:hidden}
.story .art .em{font-size:74px;filter:drop-shadow(0 12px 18px rgba(0,0,0,.15))}
.story .art .float{position:absolute;font-size:30px;opacity:.9}
.story .body{padding:18px 22px 24px;flex:1;display:flex;flex-direction:column;overflow:auto}
.story .body .grow{flex:1}
.story .x{position:absolute;right:14px;top:14px;z-index:3;border:0;background:rgba(255,255,255,.7);border-radius:50%;width:32px;height:32px;cursor:pointer;color:#333}
/* C spotlight */
.spot{position:absolute;border-radius:22px;box-shadow:0 0 0 2000px var(--shade);z-index:21;pointer-events:none;transition:all .35s}
.spot::after{content:"";position:absolute;inset:-5px;border-radius:26px;border:2px solid rgba(255,255,255,.9);animation:pulse 1.6s infinite}
.tip{position:absolute;left:16px;right:16px;z-index:22;background:var(--surface);border-radius:20px;padding:14px 15px;box-shadow:0 20px 40px -20px rgba(0,0,0,.5);animation:up .3s;max-height:62%;overflow:auto}
.tip .h{font-size:16.5px}.tip .p{margin-bottom:10px}.tip .items{margin-bottom:10px}
.tip .a{display:flex;justify-content:space-between;align-items:center;gap:8px}.tip .a .full{width:auto;padding:11px 18px;font-size:14px}
.skip{border:0;background:none;color:var(--ink-soft);font:inherit;font-size:13px;cursor:pointer}
/* D chat */
.chat{position:absolute;inset:0;z-index:22;background:var(--bg);display:flex;flex-direction:column}
.chat .top{display:flex;align-items:center;gap:10px;padding:8px 16px 10px;border-bottom:1px solid var(--line)}
.chat .top i{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#ffb4b1,#ff5a5f);display:grid;place-items:center;color:#fff;font-style:normal}
.chat .top b{font-size:15px}.chat .top small{display:block;color:var(--ink-soft);font-size:11.5px}
.chat .log{flex:1;overflow:auto;padding:14px 14px 8px}
.chat .msg{background:var(--bubble);border-radius:18px 18px 18px 6px;padding:10px 13px;margin:0 36px 8px 0;font-size:13.5px;animation:up .3s}
.chat .msg.me{background:var(--coral);color:#fff;border-radius:18px 18px 6px 18px;margin:0 0 8px 80px}
.chat .msg .items{margin:8px 0 2px}.chat .msg .items div{background:var(--soft)}
.chat .replies{display:flex;flex-wrap:wrap;gap:6px;padding:8px 14px 24px;justify-content:flex-end}
.chat .replies button{border:1.5px solid var(--coral);background:var(--surface);color:var(--coral-ink);border-radius:999px;padding:9px 14px;font:inherit;font-size:13px;cursor:pointer}
.chat .replies button.pri{background:var(--coral);color:#fff}
.chat .carousel{display:flex;gap:7px;overflow-x:auto;margin-top:8px;padding-bottom:3px}
.chat .carousel span{flex:0 0 auto;background:var(--soft);border-radius:14px;padding:8px 10px;font-size:12px;text-align:center;min-width:76px}
/* E hub */
.hub{position:absolute;inset:0;z-index:22;background:var(--bg);padding:8px 16px 26px;overflow:auto}
.ring{width:112px;height:112px;margin:6px auto 8px;position:relative}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:22px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tiles button{border:0;text-align:left;background:var(--surface);color:var(--ink);border-radius:20px;padding:13px;font:inherit;cursor:pointer;position:relative;min-height:104px}
.tiles button .ic{margin:0 0 8px}.tiles button b{display:block;font-size:14px}.tiles button small{color:var(--ink-soft);font-size:11.5px}
.tiles button.done::after{content:"✓";position:absolute;right:10px;top:10px;width:22px;height:22px;border-radius:50%;background:var(--green-ink);color:#fff;font-size:12px;display:grid;place-items:center}
.tiles button.wide{grid-column:1/-1;min-height:0;display:flex;gap:12px;align-items:center}.tiles button.wide .ic{margin:0}
.toast{position:absolute;left:16px;right:16px;bottom:92px;z-index:30;background:var(--ink);color:var(--bg);border-radius:16px;padding:11px 14px;font-size:12.5px;animation:up .3s}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(14px);opacity:0}}@keyframes pulse{50%{opacity:.25}}@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<section>
  <h1>Onboarding: 5 dizayn seçimi</h1>
  <p class="lead">Eyni məzmun, eyni məntiq, 5 fərqli görünüş. Dizaynı, mərhələni və istifadəçi vəziyyətini seçin: addımlar vəziyyətə görə avtomatik qurulur.</p>
  <div class="lbl">Dizayn</div>
  <div class="designs" id="designs"></div>
  <div class="lbl">İstifadəçi</div>
  <div class="row">
    <div class="seg" data-k="mode"><button data-v="mommy">Ana</button><button data-v="bump">Hamilə</button><button data-v="flow">Dövr</button></div>
    <div class="seg" data-k="tier"><button data-v="free">Free</button><button data-v="premium">Premium</button></div>
  </div>
  <div class="row" style="margin-top:8px">
    <div class="seg" data-k="push"><button data-v="prompt">Push: soruşulmayıb</button><button data-v="granted">icazə var</button><button data-v="denied">rədd edilib</button></div>
  </div>
  <div class="row" style="margin-top:8px">
    <div class="seg" data-k="region"><button data-v="az">Azərbaycan (az)</button><button data-v="other">Digər ölkə/dil</button></div>
    <div class="seg" data-k="theme"><button data-v="light">Light</button><button data-v="dark">Dark</button></div>
  </div>
  <div class="flow" id="flow"></div>
</section>
<section class="phone-col">
  <div class="phone"><div class="status"><span>9:41</span><span>●●● 100%</span></div><div class="screen" id="screen"></div></div>
  <div class="nav"><button class="btn ghost" id="prev">← Geri</button><button class="btn primary" id="next">Növbəti →</button></div>
</section>
</div>
<script>
const ICON={home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',grid:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>',ai:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l1.8 4.6L18 9l-4.2 1.4L12 15l-1.8-4.6L6 9l4.2-1.4z"/></svg>',chat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16v11H8l-4 4z"/></svg>',user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>'};
const DESIGNS=[['A','Vərəq','Alt vərəq, tətbiqin üstündə'],['B','Hekayə','Tam ekran kartlar'],['C','Spotlight','Real ekranda işıqlandırma'],['D','Söhbət','Anacan AI bələdçi kimi'],['E','Mərkəz','Öz tempinlə, plitələr']];
/* Server-side config the real app reads (app_settings.free_limits.ai_chat_count_per_day, default 10) */
const FREE_AI_PER_DAY=10;
const S={design:'A',mode:'mommy',tier:'free',push:'prompt',region:'az',theme:'light',step:0,hubDone:{},picked:0};
const P={mommy:{name:'Leyla',heroK:'Aylin · 4 ay 12 gün',heroT:'Bu həftə: əlləri ilə oynayır',heroS:'Bu gün üçün 3 oyun ideyası və yuxu pəncərəsi',
  quick:[['🍼','Qidalanma','var(--peach1)'],['😴','Yuxu','var(--lav1)'],['🙂','Əhval','var(--yellow1)'],['📏','Boy-çəki','var(--green1)']],
  welcome:['Aylinin yaşına uyğun gündəlik plan','Gecə də yanında: Anacan AI','Sizin kimi analar: İcma'],

  free:[['🧠','Mental sağlamlıq','Əhval və EPDS testi'],['🩹','İlk yardım','Təcili hallarda addımlar'],['🎮','Mini oyunlar','Körpə ilə oyunlar'],['♻️','İkinci əl bazar','Al, sat, hədiyyə et'],['🛍️','Tövsiyə məhsullar','Seçilmiş məhsullar']],
  premBen:[['📊','Bütün izləmə alətləri','Yuxu, qidalanma, boy-çəki, diş'],['✨','Limitsiz Anacan AI','Gündəlik limit olmadan'],['📄','Həkim üçün PDF','Qeydlər bir faylda'],['👨‍👩‍👧','Partnyor hesabı','Birgə izləyin'],['🚫','Reklamsız','Sakit təcrübə']],
  logFree:{q:'Bu gün özünüzü necə hiss edirsiniz?',o:[['😊','Yaxşı'],['😴','Yorğun'],['😔','Çətin']],done:'Əhval gündəliyiniz başladı',sub:'Hər gün 5 saniyə. Mental sağlamlıq aləti pulsuzdur.',push:'Axşamlar 1 dəqiqəlik əhval yoxlamasını xatırladaq?'},
  logPrem:{q:'Son qidalanma nə idi?',o:[['🤱','Sol döş'],['🤱','Sağ döş'],['🍼','Butulka']],done:'İlk qeyd hazırdır',sub:'Növbəti qidalanma təxminən 15:10-da.',push:'Qidalanma vaxtı çatanda xatırladaq?'}},
 bump:{name:'Nigar',heroK:'24-cü həftə',heroT:'Körpə qarğıdalı boydadır',heroS:'Bu həftə səsləri eşidir. Ona danışın.',
  quick:[['👣','Təpik','var(--peach1)'],['⚖️','Çəki','var(--green1)'],['🙂','Əhval','var(--yellow1)'],['🎒','Çanta','var(--blue1)']],
  welcome:['Həftə-həftə körpənin inkişafı','Gecə də yanında: Anacan AI','Sizin kimi analar: İcma'],
  premTop:[['👣','Təpik sayğacı'],['⏱️','Sancı ölçən'],['⚖️','Çəki və təzyiq'],['🎒','Xəstəxana çantası'],['👶','Ad tapıcı'],['📸','Hamiləlik albomu']],
  free:[['🧠','Mental sağlamlıq','Əhval və narahatlıq testi'],['🎮','Mini oyunlar','İstirahət üçün'],['♻️','İkinci əl bazar','Körpə əşyaları'],['🛍️','Tövsiyə məhsullar','Seçilmiş məhsullar']],

 else if(st.id==='log'&&askPush())rep=`<button data-act="pushno">İndi yox</button><button class="pri" data-act="pushyes">🔔 Bəli, xatırlat</button>`;

function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.getElementById('screen').appendChild(d);setTimeout(()=>d.remove(),2600);}
function next(){const all=steps();S.picked=0;if(S.step<all.length-1){S.step++;}else{S.done=true;}render();}
document.addEventListener('click',e=>{const t=e.target.closest('[data-act],[data-design],[data-goto],.seg button');if(!t)return;
 if(t.dataset.design){S.pushAsked=false;S.design=t.dataset.design;S.step=0;S.done=false;S.picked=0;S.hubDone={};S.hubOpen=null;return render();}
 if(t.dataset.goto!==undefined){if(t.dataset.goto==='end'){S.done=true;}else{S.done=false;S.step=+t.dataset.goto;S.picked=0;S.hubOpen=null;}return render();}
 if(t.parentNode.classList&&t.parentNode.classList.contains('seg')){S[t.parentNode.dataset.k]=t.dataset.v;if(t.parentNode.dataset.k!=='theme'){S.pushAsked=false;S.step=0;S.done=false;S.picked=0;S.hubDone={};S.hubOpen=null;}return render();}
 const a=t.dataset.act;
 if(a==='pick'){t.parentNode.querySelectorAll('button').forEach(b=>b.classList.remove('on'));t.classList.add('on');return;}
 if(a==='logged'){S.picked=2;if(S.design==='E'&&!askPush()){S.hubDone.log=true;}return render();}
 if(a==='skiplog'){if(S.design==='E'){S.hubOpen=null;return render();}return next();}
 if(a==='pushyes'||a==='pushno'){toast(a==='pushyes'?'Burada sistem icazə pəncərəsi açılır (iOS/Android). Nəticə serverdə qeyd olunur.':'Yaxşı. 3 gün sonra uyğun anda 1 dəfə yenidən soruşacağıq.');if(a==='pushyes')S.push='granted';else S.pushAsked=true;if(S.design==='E'){S.hubDone.log=true;S.hubOpen=null;S.picked=0;return render();}setTimeout(next,700);return;}
 if(a==='paywall'){toast('Burada mövcud paywall açılır (real store qiymətləri ilə).');return;}
 if(a==='close'){S.done=true;toast('Tur bağlandı. Qalanlar "Başlanğıc" siyahısındadır.');return render();}
 if(a==='hub'){S.hubOpen=t.dataset.id;S.picked=0;return render();}
 if(a==='hubclose'){S.hubOpen=null;return render();}
 if(a==='hubdone'){S.hubDone[S.hubOpen]=true;S.hubOpen=null;if(steps().every(s=>S.hubDone[s.id]))S.done=true;return render();}
 if(a==='next')return next();});
document.getElementById('prev').onclick=()=>{if(S.done){S.done=false;}else S.step=Math.max(0,S.step-1);S.picked=0;S.hubOpen=null;render();};
document.getElementById('next').onclick=()=>{if(S.done){S.done=false;S.step=0;S.hubDone={};}else next();render();};
render();
</script>
</body>
</html>
