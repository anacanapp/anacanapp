 bir az körpə yağı (və ya zeytun yağı) istifadə edin."],["p","&amp;gt;"],["h","1. \"Səni Sevirəm\" (I Love You) Masajı"],["p","Bu, dünyada ən populyar kolik masajıdır. Bağırsaqların saat əqrəbi istiqamətində işləməsinə kömək edir."],["p","Körpə arxa üstə uzanır:"],["li","<b>\"I\":</b> Sol tərəfdən (sizə görə körpənin sol tərəfi) qabırğanın altından ombaya doğru düz bir xətt çəkin (\"I\" hərfi)."],["li","<b>\"L\":</b> Sağ tərəfdən başlayıb qarnın üstündən sola, sonra aşağı doğru tərs \"L\" hərfi çəkin."],["li","<b>\"U\":</b> Sağ ombadan başlayıb yuxarı, sonra sola və aşağı doğru tərs \"U\" hərfi çəkin."],["p","Bunu 5-10 dəfə təkrarlayın və hər dəfə körpəyə \"Səni sevirəm\" deyin."],["h","2. Velosiped Hərəkəti"],["p","Körpə arxa üstə uzanır. Onun ayaqlarından tutub yavaşca, sanki velosiped sürür kimi hərəkət etdirin. Sonra hər iki dizini qarnına doğru itələyib 3-5 saniyə saxlayın. Bu hərəkət qazın xaric olmasına (pırtlamasına) çox kömək edir."],["h","3. Saat Əqrəbi (Günəş və Ay)"],["p","Əlinizin içi ilə körpənin göbəyi ətrafında, saat əqrəbi istiqamətində dairəvi hərəkətlər edin. Bu, həzm sisteminin təbii axınına uyğundur və qaz qabarcıqlarını bağırsaq boyunca irəlilədir."],["h","Sancını sakitləşdirməyin digər yolları"]]},{"id": "vaccines","stage": "mommy","tone": "c-yellow","cat": "Körpə baxımı","min": 5,"title": "Peyvənd təqvimi: Uşağınızın sağlamlığı üçün hansı vaksinlər vacibdir?","excerpt": "Azərbaycan Respublikasının Milli Peyvənd Təqvimi: Hansı ayda hansı peyvənd vurulmalıdır? Hepatit B, Vərəm (BCG), Göyöskürək və Qızılca vaksinləri haqqında valideynlər üçün ətraflı bələdçi. Peyvənddən sonrakı reaksiyalar.","img": "img/art-vaccines.webp","body": [["p","&lt;p&gt;Körpəniz dünyaya gəldiyi andan etibarən sizin əsas vəzifəniz onu qorumaqdır. Soyuqdan, istidən, aclıqdan... Bəs gözlə görünməyən təhlükələrdən – viruslardan və bakteriyalardan necə qoruyacaqsınız? Cavab sadədir: &lt;strong&gt;Peyvəndlər (Vaksinasiya)&lt;/strong&gt;.&lt;/p&gt;&lt;p&gt;Peyvənd, bəşəriyyətin icad etdiyi ən təsirli tibbi müdaxilələrdən biridir. Məhz peyvəndlər sayəsində bu gün çiçək xəstəliyi yox olub, poliomielit (uşaq iflici) nadir hallarda rast gəlinir. Lakin son illərdə internetdə yayılan dezinformasiyalar valideynlərdə ciddi tərəddüdlər yaradır: &lt;em&gt;\"Peyvənd zərərlidirmi?\", \"İmmuniteti zəiflədirmi?\"&lt;/em&gt;.&lt;/p&gt;&lt;p&gt;Bu məqalədə, Azərbaycanda tətbiq olunan &lt;strong&gt;Milli Peyvənd Təqvimi&lt;/strong&gt;ni addım-addım izah edəcək və vaksinlərin körpəniz üçün niyə həyati əhəmiyyət daşıdığını araşdıracağıq.&lt;/p&gt;&lt;h2 id=\"section-1\"&gt;Niyə peyvənd vurdurmalısınız?&lt;/h2&gt;&lt;p&gt;Körpələr analarından aldıqları anticisimlər sayəsində müəyyən bir immunitetlə doğulurlar. Lakin bu müdafiə müvəqqətidir (bir neçə ay davam edir). Peyvəndlər, körpənin öz immun sisteminə \"təlim keçir\".&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Təbii xəstəlikdən daha təhlükəsizdir:&lt;/strong&gt; Peyvənd körpəni xəstələndirmədən immunitet yaradır. Təbii yolla immunitet qazanmaq üçün uşaq o ağır xəstəliyi (məsələn, qızılcanı) keçirməlidir ki, bu da ciddi fəsadlara (sətəlcəm, beyin iltihabı) səbəb ola bilər.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Kütləvi immunitet:&lt;/strong&gt; Peyvənd təkcə sizin övladınızı deyil, peyvənd oluna bilməyən (xərçəng xəstəsi, allergiyalı) uşaqları da qoruyur.&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;/p&gt;&lt;h2 id=\"section-2\"&gt;Azərbaycan Respublikasının Milli Peyvənd Təqvimi&lt;/h2&gt;&lt;p&gt;Ölkəmizdə peyvəndlər dövlət poliklinikalarında &lt;strong&gt;ödənişsiz&lt;/strong&gt; həyata keçirilir.&lt;/p&gt;&lt;h3&gt;1. Doğum evində (İlk 12-24 saat)&lt;/h3&gt;&lt;p&gt;Körpəniz həyatının ilk günündə iki vacib düşmənlə tanış olur:&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Hepatit B (1-ci doza):&lt;/strong&gt; Qaraciyəri zədələyən virusa qarşı. (Budun yan səthinə vurulur).&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;BCG (Vərəm əleyhinə):&lt;/strong&gt; Vərəmin ağır formalarından (meningit) qoruyur. (Sol qolun yuxarı hissəsinə vurulur və adətən ömürlük kiçik iz buraxır).&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;/p&gt;&lt;h3&gt;2. 2 aylığında&lt;/h3&gt;&lt;p&gt;Bu dövrdə \"kombinə olunmuş\" (bir iynədə bir neçə xəstəlik) peyvəndlər başlayır:&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;AKDT (Göyöskürək, Difteriya, Tetanus):&lt;/strong&gt; 1-ci doza.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Hepatit B:&lt;/strong&gt; 2-ci doza.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;HİB (Hemofilus İnfluenza B):&lt;/strong&gt; Meningit və sətəlcəm törədicisi.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;İPV (Poliomielit):&lt;/strong&gt; İflicə qarşı iynə forması.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Pnevmokok (Prevenar):&lt;/strong&gt; Sətəlcəm və qulaq iltihabına qarşı. 1-ci doza.&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;/p&gt;&lt;h3&gt;3. 3 aylığında&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;AKDT + HİB:&lt;/strong&gt; 2-ci doza.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;OPV (Poliomielit):&lt;/strong&gt; Damcı forması (ağıza damızdırılır).&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;/p&gt;&lt;h3&gt;4. 4 aylığında&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;AKDT + HİB:&lt;/strong&gt; 3-cü doza.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;OPV (Poliomielit):&lt;/strong&gt; Damcı.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Pnevmokok:&lt;/strong&gt; 2-ci doza.&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;/p&gt;&lt;h3&gt;5. 6 aylığında&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Hepatit B:&lt;/strong&gt; 3-cü doza (Tam kurs bitir).&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;OPV:&lt;/strong&gt; Damcı.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Pnevmokok:&lt;/strong&gt; 3-cü doza.&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;/p&gt;&lt;h3&gt;6. 1 yaşda (12 ay)&lt;/h3&gt;&lt;p&gt;Bu, valideynlərin ən çox qorxduğu, amma ən vacib peyvəndlərdən biridir:&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;QPM (Qızılca, Parotit \"Svinka\", Məxmərək):&lt;/strong&gt; 1-ci doza.&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;/p&gt;&lt;h3&gt;7. 18 aylığında (1 yaş yarım)&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;AKDT:&lt;/strong&gt; Revaksinasiya (Gücləndirici doza).&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;OPV:&lt;/strong&gt; Damcı.&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;/p&gt;&lt;h3&gt;8. 6 yaşda (Məktəbəqədər)&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;QPM:&lt;/strong&gt; 2-ci doza.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;ADT (Difteriya, Tetanus):&lt;/strong&gt; Göyöskürək komponenti olmadan.&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;/p&gt;&lt;h2 id=\"section-3\"&gt;Peyvənddən sonra: Reaksiyalar normaldırmı?&lt;/h2&gt;&lt;p&gt;Bəli, peyvənddən sonra körpənizdə bəzi yüngül reaksiyalar ola bilər. Bu, immunitetin \"işlədiyini\" göstərir.&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Qızdırma:&lt;/strong&gt; 37.5 - 38.5°C-yə qədər qalxa bilər. (Parasetamol verə bilərsiniz, həkimlə məsləhətləşin).&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Narahatlıq:&lt;/strong&gt; Körpə biraz ağlağan ola bilər.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;İynə yerində qızartı:&lt;/strong&gt; Bir neçə gün ərzində keçib gedir.&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;/p&gt;&lt;blockquote&gt;&lt;p&gt;Mif: \"Peyvənd аутизм (autizm) yaradır.\"&lt;/p&gt;&lt;/blockquote&gt;&lt;p&gt;Həqiqət: Bu iddia 1998-ci ildə saxtalaşdırılmış bir məqalədən yaranıb və sonradan dəfələrlə təkzib edilib. Elmi araşdırmalar sübut edir ki, peyvəndlərlə autizm arasında heç bir əlaqə yoxdur.&lt;/p&gt;&lt;p&gt;&amp;gt;&lt;/p&gt;&lt;h2 id=\"section-4\"&gt;Nə vaxt peyvənd vurmaq olmaz? (Əks-göstərişlər)&lt;/h2&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Körpənin &lt;strong&gt;yüksək hərarəti&lt;/strong&gt; (38°C-dən yuxarı) varsa (peyvənd təxirə salınır).&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Əvvəlki dozaya qarşı &lt;strong&gt;şiddətli allergik reaksiya&lt;/strong&gt; (anafilaksiya) olubsa.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;İmmun çatışmazlığı xəstəliyi varsa (canlı vaksinlər vurulmur).&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;/p&gt;&lt;p&gt;&lt;em&gt;Yüngül soyuqdəymə və ya burun axması peyvənd üçün maneə deyil.&lt;/em&gt;&lt;/p&gt;&lt;p&gt;Peyvənd qrafiki qarışıq görünə bilər, amma hər bir doza körpənizin sağlam gələcəyi üçün bir kərpicdir. Poliklinikanızla əlaqə saxlayın və peyvənd günlərini qaçırmayın.&lt;/p&gt;&lt;p&gt;Peyvənd tarixlərini unutmamaq üçün &lt;strong&gt;Anacan tətbiqindəki \"Peyvənd Təqvimi\"&lt;/strong&gt; funksiyasından istifadə edin. Tətbiq sizə növbəti peyvəndin vaxtını xatırladacaq.&lt;/p&gt;"]]},{"id": "newborn","stage": "mommy","tone": "c-blue","cat": "Körpə baxımı","min": 5,"title": "Yeni doğulmuş körpəyə qulluq: İlk günlərdə bilməli olduğunuz hər şey (Çimmək, göbək baxımı)","excerpt": "Doğum evindən evə qayıtdıqdan sonra ilk günlər: Körpənin göbəyinə necə qulluq etməli? İlk çimdik (vanna) qaydaları, bez dəyişmə və dəriyə qulluq. Gənc analar üçün addım-addım təlimat.","img": "img/art-newborn.webp","body": [["p","Doğum evinin qapısından çıxıb, qucağınızdakı o balaca \"bağlama\" ilə evə daxil olduğunuz an... Bu, həm dünyanın ən xoşbəxt, həm də ən qorxulu anıdır. Xəstəxanada tibb bacıları hər şeyi edirdi, bəs indi?"],["p","Körpə o qədər kiçik və zərif görünür ki, ona toxunmağa belə qorxursunuz. *\"Göbəyini incidərəmmi?\", \"Suyu çox isti olar?\", \"Paltarını düzgün geyindirdimmi?\"* kimi suallar beyninizdə fırlanır."],["p","Əziz ana (və ata), sakit olun. Körpələr düşündüyünüzdən daha dözümlüdürlər. Bu məqalədə, ilk günlərdə ən çox ehtiyacınız olacaq baza bilikləri – gigiyena, çimmək və göbək baxımını sadə və anlaşıqlı dildə izah edəcəyik."],["h","1. Göbək Baxımı: Toxunmağa qorxmayın!"],["p","Yeni doğulmuş körpənin göbək ciyəsi qalığı (kötüyü), valideynləri ən çox narahat edən hissədir. O, adətən doğuşdan 10-21 gün sonra quruyub öz-özünə düşür. O vaxta qədər əsas qayda <b>\"Təmiz və Quru saxlamaq\"</b>dır."],["h","Qızıl Qaydalar:"],["li","<b>Spirt və Zelyonka (Brilyant yaşılı) sürtməyin:</b> Müasir pediatriya bunu tövsiyə etmir. Bu maddələr dərini yandıra və sağalma prosesini gecikdirə bilər. Sadəcə qaynadılmış su və steril tənziflə silmək kifayətdir."],["li","<b>Bezi göbəyin altında bağlayın:</b> Bezin kənarını qatlayın ki, göbək açıqda qalsın və hava dəysin. Hava dəyməsi qurumanı sürətləndirir."],["li","<b>Çimmək olar:</b> Göbək düşməmiş körpəni çimdirmək olar, sadəcə çimdikdən sonra həmin nahiyəni ehtiyatla və tam qurutmaq lazımdır."],["h","Təhlükə siqnalları (Nə vaxt həkimə deməli?):"],["li","Göbək ətrafında qızartı və şişkinlik varsa."],["li","Pis qoxulu və ya irinli axıntı gəlirsə."],["li","Körpə göbəyə toxunanda ağlayırsa."],["h","2. İlk Çimdik: Su ilə tanışlıq"],["p","Körpənizi hər gün çimdirməyə ehtiyac yoxdur (həftədə 2-3 dəfə kifayətdir), lakin bizim mədəniyyətimizdə gündəlik yuyunma (xüsusilə axşamlar yuxudan əvvəl) bir ənənədir və körpəni sakitləşdirmək üçün faydalıdır."],["h","Hazırlıq:"],["p","Otağın temperaturu <b>24-26°C</b>, suyun temperaturu isə <b>37°C</b> (bədən temperaturu) olmalıdır. Suyun istiliyini yoxlamaq üçün dirsəyinizi suya salın – nə isti, nə də soyuq olmalıdır."],["h","Addım-addım:"],["li","<b>Təhlükəsizlik:</b> Bütün ləvazimatları (dəsmal, sabun, bez) əlinizin çatacağı yerə qoyun. Körpəni heç vaxt suda tək qoymayın!"],["li","<b>Yavaş-yavaş:</b> Körpəni suya qəfil salmayın. Əvvəlcə ayaqlarını, sonra bədənini salın. Başını və boynunu qolunuzla dəstəkləyin."],["li","<b>Üz və Baş:</b> Üzünü sabunsuz, təmiz su ilə yuyun. Gözlərini içdən xaricə doğru silin. Başını xüsusi körpə şampunu ilə (göz yandırmayan) yuyun."],["li","<b>Bədən:</b> Qoltuqaltı, boyun büküşləri və barmaq aralarını yumağı unutmayın."],["p","&amp;gt; Mif: \"Qırxı çıxana qədər suya duz tökmək lazımdır.\""],["p","Həqiqət: Duzlu su körpənin zərif dərisini quruda və qaşındıra bilər. Adi kran suyu (əgər təmizdirsə) və ya qaynadılmış su ən yaxşısıdır."],["p","&amp;gt;"],["h","3. Bez Dəyişmə və \"Bişməcə\"dən qorunma"]]},{"id": "massage","stage": "mommy","tone": "c-pink","cat": "Körpə baxımı","min": 5,"title": "Körpə masajı: Ev şəraitində necə edilir? (Addım-addım Təlimat)","excerpt": "Körpənizi necə sakitləşdirmək olar? Ev şəraitində körpə masajı üçün 5 əsas texnika. Qaz sancısı (kolik) və yuxu üçün masaj qaydaları, yağ seçimi və təhlükəsizlik məsləhətləri.","img": "img/art-massage.webp","body": [["p","Toxunmaq – yeni doğulmuş körpənin anladığı ilk dildir. Körpənizi qucağınıza aldığınızda, sığalladığınızda o, özünü təhlükəsizlikdə hiss edir. Masaj isə bu toxunuşun ən faydalı və sehirlı formasıdır."],["p","Bir çox valideyn masajı yalnız peşəkarların edə biləcəyi qorxulu bir prosedur kimi görür. *\"Birdən sümüyünü incidərəm?\", \"Səhv etsəm nə olar?\"*. Qorxmayın! Ana (və ata) masajı müalicəvi prosedurlardan fərqlidir. Bu, sevgi dolu bir ritualdır və bunu etmək üçün diplom lazım deyil, sadəcə sevgi və diqqət kifayətdir."],["p","Bu məqalədə, körpənizlə bağınızı gücləndirəcək, qaz sancılarını azaldacaq və yuxusunu yaxşılaşdıracaq masaj texnikalarını addım-addım izah edəcəyik."],["h","Körpə masajının faydaları nədir?"],["p","Masaj sadəcə \"sığallamaq\" deyil, körpənin inkişafı üçün güclü bir vasitədir:"],["li","<b>Sakitləşdirir:</b> Stress hormonunu (kortizol) azaldır və \"xoşbəxtlik hormonları\"nı (oksitosin, serotonin) artırır. Nəticə: Daha az ağlayan və daha yaxşı yatan körpə."],["li","<b>Həzmi yaxşılaşdırır:</b> Qarın masajı qaz sancılarını (kolik) və qəbizliyi aradan qaldırmağın ən təbii yoludur."],["li","<b>Əzələ inkişafı:</b> Körpənin bədənini tanımasına və əzələ tonusunun tənzimlənməsinə kömək edir."],["li","<b>Emosional bağ:</b> Göz təması və toxunuş valideynlə körpə arasındakı bağı möhkəmləndirir (xüsusilə atalar üçün əla fürsətdir!)."],["h","Hazırlıq: \"Körpə SPA\" mühiti yaratmaq"],["p","Uğurlu masaj üçün düzgün zaman və məkan şərtdir."],["li","<b>Zaman:</b> Körpə nə çox ac, nə də çox tox olmalıdır. Yeməkdən ən azı <b>30-40 dəqiqə sonra</b> başlayın. Körpə sakit və oyaq olmalıdır."],["li","<b>Mühit:</b> Otaq isti (24-26°C) və işıqlandırma yumşaq olmalıdır. Körpəni rahat bir səthə (yataq və ya dəyişmə masası) uzadın, altına dəsmal sərin."],["li","<b>Yağ seçimi:</b> İysiz və yeyilə bilən təbii yağlar ən yaxşısıdır. <b>Badam yağı</b>, <b>Üzüm çəyirdəyi yağı</b> və ya sadəcə sterilizə olunmuş zeytun yağı istifadə edə bilərsiniz. (Məsamələri tıxayan mineral yağlardan qaçın)."],["p","&amp;gt; Qızıl Qayda: Masaja başlamazdan əvvəl əllərinizi bir-birinə sürtərək yaxşıca isidin. Soyuq əllər körpəni diksindirə bilər."],["p","&amp;gt;"],["h","Addım-addım Masaj Texnikaları"],["h","1. Ayaqlar: \"Hind üsulu sağma\""],["p","Körpələr ayaqlarının masaj edilməsini çox sevirlər, çünki bu, onlara bələklənmə hissi verir."],["li","Bir əlinizlə körpənin topuğundan tutun."],["li","Digər əlinizlə budundan başlayaraq topuğa doğru, sanki \"inək sağırmış kimi\" sığallayın."],["li","Əllərinizi növbəli şəkildə dəyişərək hərəkəti təkrarlayın."],["li","Sonda pəncənin altını baş barmağınızla yüngülcə ovuşdurun."],["h","2. Qarın: \"Səni Sevirəm\" (I Love You)"],["p","Bu hərəkət qaz sancısı və qəbizlik üçün ən effektiv üsuldur. (Hərəkətləri saat əqrəbi istiqamətində edin)."],["li","<b>\"I\":</b> Sol tərəfdən (sizə görə sağ) aşağı doğru düz xətt çəkin."]]},{"id": "pms","stage": "flow","tone": "c-peach","cat": "Hamiləlik","min": 5,"title": "Dözülməz aybaşı sancıları (Dismenoreya): Təbii vasitələr və nə vaxt həkimə getməli?","excerpt": "Aybaşı zamanı şiddətli ağrılar (dismenoreya) niyə yaranır? Ev şəraitində ağrını kəsməyin 5 təbii yolu: istilik, bitki çayları və masaj. Endometrioz şübhəsi və həkimə müraciət edilməli hallar","img": "img/art-pms.webp","body": [["p","&lt;p&gt;Ayın o günləri yaxınlaşdıqda qorxu hissi keçirirsiniz? İlk günləri yataqdan qalxa bilmir, işdən və ya dərsdən icazə alırsınız? Ətrafınızdakılar &lt;em&gt;\"Bu, qadınların qismətidir, dözməlisən\"&lt;/em&gt; və ya &lt;em&gt;\"Evlənəndə keçər\"&lt;/em&gt; deyib ağrınızı kiçildirsə də, siz bilirsiniz ki, bu ağrı normal deyil.&lt;/p&gt;&lt;p&gt;Tibbi dildə &lt;strong&gt;Dismenoreya&lt;/strong&gt; adlanan ağrılı aybaşı, dünyada milyonlarla qadının həyat keyfiyyətini aşağı salan bir problemdir. Lakin \"dözmək\" yeganə çıxış yolu deyil.&lt;/p&gt;&lt;p&gt;Bu məqalədə, sancıların əsl səbəbini, ağrıkəsicilərə əl atmadan əvvəl sınaya biləcəyiniz təbii üsulları və hansı halda bu ağrının ciddi bir xəstəliyin (məsələn, Endometriozun) xəbərçisi olduğunu araşdıracağıq.&lt;/p&gt;&lt;h2 id=\"section-1\"&gt;Niyə ağrıyır? &lt;/h2&gt;&lt;p&gt;Aybaşı zamanı uşaqlıq (rəhm), daxilindəki qatı (endometriumu) xaric etmək üçün yığılır. Bu yığılmanı təmin edən maddələrə &lt;strong&gt;Prostaqlandinlər&lt;/strong&gt; deyilir.&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Sadə izah:&lt;/strong&gt; Prostaqlandin səviyyəsi nə qədər yüksək olarsa, uşaqlıq o qədər güclü sıxılır və bu da qan dövranını müvəqqəti dayandıraraq kəskin ağrıya səbəb olur. Bu, &lt;strong&gt;Birincili Dismenoreya&lt;/strong&gt;dır və adətən gənc qızlarda rast gəlinir.&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;Lakin ağrı başqa səbəblərdən (kista, mioma, endometrioz) yaranırsa, bu &lt;strong&gt;İkincili Dismenoreya&lt;/strong&gt; adlanır və mütləq müalicə tələb edir.&lt;/p&gt;&lt;h2 id=\"section-2\"&gt;Evdə Təcili Yardım: 5 Təbii Vasitə&lt;/h2&gt;&lt;p&gt;Əgər dərman içmək istəmirsinizsə və ya dərman təsir edənə qədər rahatlamaq istəyirsinizsə, bu üsulları sınayın:&lt;/p&gt;&lt;h3&gt;1. İstilik (Qrelka) – Ən qədim və ən təsirli üsul&lt;/h3&gt;&lt;p&gt;Nənələrimizin \"qarnına isti qoy\" məsləhəti elmi cəhətdən təsdiqlənib. İstilik uşaqlıq əzələlərini boşaldır və qan dövranını artırır.&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Necə etməli:&lt;/strong&gt; İsti su torbasını (qrelka) və ya ütülənmiş isti dəsmalı qarnınızın aşağı hissəsinə qoyun. İsti duş qəbul etmək də eyni effekti verir.&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;h3&gt;2. Möcüzəvi Bitki Çayları&lt;/h3&gt;&lt;p&gt;Bəzi bitkilər təbii spazmolitik (spazm açan) təsirə malikdir.&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Çobanyastığı (Romaşka):&lt;/strong&gt; Sakitləşdirici təsiri ilə həm əsəbləri, həm də əzələləri yumşaldır.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Zəncəfil:&lt;/strong&gt; İltihab əleyhinə güclü təsiri var. Təzə zəncəfili rəndələyib çay kimi dəmləyin.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Darçın:&lt;/strong&gt; Qanaxmanı tənzimləməyə və ağrını azaltmağa kömək edir.&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;h3&gt;3. Maqneziumla zəngin qidalar&lt;/h3&gt;&lt;p&gt;Maqnezium \"təbii relaksant\"dır. Aybaşıdan bir neçə gün əvvəl maqneziumla zəngin qidaları artırın.&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Nə yeməli:&lt;/strong&gt; Banan, qara şokolad (bəli, şokolad!), badam, ispanaq və balqabaq tumu.&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;h3&gt;4. Masaj və Efir yağları&lt;/h3&gt;&lt;p&gt;Qarnın aşağı hissəsini yüngül dairəvi hərəkətlərlə masaj etmək spazmı azalda bilər.&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Resept:&lt;/strong&gt; Bir az baza yağına (zeytun və ya badam) bir neçə damcı &lt;strong&gt;Lavanda&lt;/strong&gt; və ya &lt;strong&gt;Nanə&lt;/strong&gt; yağı qatın. Lavanda sakitləşdirir, nanə isə ağrını \"keyidir\".&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;h3&gt;5. Hərəkət edin (Divanda bükülüb qalmayın)&lt;/h3&gt;&lt;p&gt;Bilirik, ağrı zamanı hərəkət etmək ən son istədiyiniz şeydir. Lakin yüngül gəzinti və ya xüsusi yoqa hərəkətləri (məsələn, \"Uşaq pozası\" və ya \"Pişik-İnək\" hərəkəti) endorfin ifrazını artıraraq təbii ağrıkəsici rolunu oynayır.&lt;/p&gt;&lt;h2 id=\"section-3\"&gt;Nə vaxt həkimə getməli? &lt;/h2&gt;&lt;p&gt;Hər aybaşı sancısı normal deyil. Əgər aşağıdakı halları yaşayırsınızsa, bu, sadəcə \"xasiyyət\" deyil, tibbi problem ola bilər:&lt;/p&gt;&lt;ol&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Dərmanlar kömək etmirsə:&lt;/strong&gt; İbuprofen və ya digər ağrıkəsiciləri içməyinizə baxmayaraq ağrı kəsilmirsə.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Həyatınız iflic olursa:&lt;/strong&gt; Ağrıya görə işə, dərsə gedə bilmir, gündəlik işlərinizi görə bilmirsinizsə.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Ağrı müddəti:&lt;/strong&gt; Sancılar aybaşıdan 2-3 gün əvvəl başlayıb, qanaxma bitdikdən sonra da davam edirsə.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Yaş faktoru:&lt;/strong&gt; Ağrılı aybaşılar gənc yaşda deyil, 25 yaşdan sonra qəfil başlayıbsa.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Digər simptomlar:&lt;/strong&gt; Ağrı ilə yanaşı qeyri-adi axıntı, cinsi əlaqə zamanı ağrı və ya sonsuzluq problemi varsa.&lt;/p&gt;&lt;/li&gt;&lt;/ol&gt;&lt;p&gt;Bu əlamətlər &lt;strong&gt;Endometrioz&lt;/strong&gt;, &lt;strong&gt;Uşaqlıq Mioması&lt;/strong&gt; və ya &lt;strong&gt;Kistaların&lt;/strong&gt; xəbərçisi ola bilər. Zamanında qoyulan diaqnoz sizi illərlə çəkilən əziyyətdən qurtara bilər.&lt;/p&gt;&lt;h2 id=\"section-4\"&gt;&lt;/h2&gt;&lt;p&gt;Aybaşı sancısı qadın olmağın \"cəzası\" deyil. Bədəniniz sizə nəsə demək istəyir. Təbii vasitələri sınayın, özünüzə qulluq edin (istirahət edin, bol su için) və əgər ağrı dözülməzdirsə, mütləq ginekoloqla məsləhətləşin.&lt;/p&gt;&lt;p&gt;Sancılarınızı izləmək və hansı günlərdə şiddətləndiyini görmək üçün &lt;strong&gt;Anacan tətbiqini&lt;/strong&gt; yükləyin. Tətbiqdəki gündəliyə ağrı dərəcəsini (1-dən 10-a qədər) və qəbul etdiyiniz dərmanları qeyd etmək, həkiminizə dəqiq diaqnoz qoymaqda kömək edəcək.&lt;/p&gt;"]]},{"id": "phases","stage": "flow","tone": "c-lav","cat": "Hamiləlik","min": 5,"title": "Aybaşı təqvimi niyə vacibdir? \"Anacan\" ilə izləməyin 3 sağlamlıq faydası","excerpt": "Aybaşı tsiklini izləmək niyə vacibdir? Menstruasiya təqviminin gizli faydaları: xəstəliklərin erkən diaqnozu, PMS-i idarə etmək və həkimə dəqiq məlumat vermək. \"Anacan\" tətbiqi ilə sağlamlığınızı ovucunuzun içində saxlayın.","img": "img/art-phases.webp","body": [["p","Ginekoloq qəbuluna getdiyiniz zaman sizə verilən ilk sual hər zaman eynidir: \"Sonuncu aybaşınız nə vaxt olub?\"."],["p","Bu an bir çox qadın təlaşla yaddaşını yoxlayır, təxmini rəqəmlər səsləndirir və ya \"ayın əvvəli idi, bəlkə də ortası\" deyə tərəddüd edir. Əksər xanımlar aybaşı təqvimini yalnız iki halda izləməyə ehtiyac duyurlar: ya hamilə qalmaq istəyəndə, ya da hamiləlikdən qorunmaq istəyəndə."],["p","Lakin həqiqət budur ki, menstrual tsikl qadın orqanizminin \"beşinci həyati göstəricisi\"dir (nəbz, temperatur, təzyiq və tənəffüslə birlikdə). O, sadəcə qanaxma günləri deyil, bədəninizin sizə göndərdiyi aylıq sağlamlıq hesabatıdır."],["p","Bu günləri dəftərdə qeyd etmək keçmişdə qaldı. Müasir dövrdə \"Anacan\" kimi ağıllı tətbiqlər bu prosesi saniyələr içində həll edir. Bəs niyə hər bir qadın öz tsiklini izləməlidir? Gəlin, bunun 3 əsas sağlamlıq faydasına nəzər salaq."],["li","Erkən Diaqnoz: Bədəninizin \"SOS\" siqnallarını görmək"],["p","Aybaşı tsikli hormonlarınızın güzgüsüdür. Əgər tsiklinizdə qəfil dəyişikliklər baş verirsə, bu, daxildə gedən gizli problemlərin ilk işarəsi ola bilər."],["p","Müntəzəm izləmə apardıqda siz \"normal\"ın nə olduğunu bilirsiniz. Anacan tətbiqi sizə aşağıdakı sapmaları vaxtında görməyə kömək edir:"],["li","Tsikl uzunluğunun dəyişməsi: Əgər tsikliniz qəfil qısalırsa (21 gündən az) və ya uzanırsa (35 gündən çox), bu, Polikistoz Yumurtalıqlar Sindromu (PCOS), tiroid vəzi problemləri və ya hormonal disbalansın xəbərçisi ola bilər."],["li","Ləkələnmələr: Aybaşı arası qanaxmalar polip və ya fibroma kimi problemlərə işarə edə bilər."],["li","Ağrıların şiddəti: Tətbiqdə ağrı dərəcəsini qeyd etməklə, zamanla bunun pisləşib-pisləşmədiyini görə bilərsiniz (Endometrioz şübhəsi)."],["p","Tətbiq vasitəsilə siz bu \"anormallıqları\" aylar sonra deyil, dərhal fərq edib həkimə müraciət edə bilərsiniz."],["li","PMS və Əhval Dəyişikliyini İdarə Etmək"],["p","Heç olubmu ki, səbəbsiz yerə əsəbiləşmisiniz, ağlamısınız və ya hamıya qışqırmaq istəmisiniz, sonra isə 2 gün keçib və aybaşınız başlayıb? \"Aha, deməli buna görə imiş!\" deyib rahatlamısınız."],["p","Premenstrual Sindrom (PMS) bir çox qadın üçün kabusdur. Lakin \"düşmənin nə vaxt gələcəyini\" bilsəniz, ona hazırlaşa bilərsiniz."],["p","\"Anacan\" tətbiqi ilə:"],["li","Proqnoz: Tətbiq sizə PMS dövrünün yaxınlaşdığını xəbərdar edir."],["li","Hazırlıq: Siz bilirsiniz ki, gələn həftə enerjiniz aşağı ola bilər və ya daha həssas olacaqsınız. Buna görə vacib görüşləri təxirə sala, özünüzə qarşı daha anlayışlı ola və ya şirniyyat istəyini sağlam alternativlərlə əvəz edə bilərsiniz."],["li","Simptom İzləmə: Baş ağrısı, döşlərdə şişkinlik və ya sızanaqları qeyd edərək, hər ay təkrarlanan qanunauyğunluqları görə bilərsiniz."],["li","Həkimlə Dəqiq Ünsiyyət və Düzgün Müalicə"],["p","Həkimə getdikdə \"Keçən ayın neçəsi olmuşdum?\" deyə fal açmaqdansa, telefonu çıxarıb dəqiq məlumat vermək diaqnozun yarısıdır."],["p","\"Anacan\" tətbiqi sizin rəqəmsal sağlamlıq kartınız rolunu oynayır. Siz həkimə təkcə son tarixi deyil, həm də aşağıdakı detalları göstərə bilərsiniz:"],["li","Son 6 ayın tsikl uzunluğu və müntəzəmliyi."],["li","Qanaxmanın miqdarı (gur və ya az olması)."],["li","Ağrıların hansı günlərdə başladığı."],["li","Cinsi əlaqə günləri (hamiləlik planlayanlar üçün)."],["p","Bu dəqiq məlumatlar həkimə lazımsız analizlər təyin etmədən, birbaşa problemin kökünə enməyə kömək edir."]]},{"id": "ovulation","stage": "flow","tone": "c-green","cat": "Hamiləlik","min": 5,"title": "Ovulyasiya gününü necə hesablamalı? Hamilə qalmaq şansını artıran üsullar","excerpt": "Hamilə qalmaq şansınızı artırmaq üçün ovulyasiya gününü necə hesablamalısınız? Təqvim metodu, bazal temperatur, servikal maye və ovulyasiya testləri haqqında ətraflı bələdçi.","img": "img/art-ovulation.webp","body": [["p","&lt;p&gt;Hamiləlik planlaşdırarkən bir çox cütlük üçün \"niyə hələ də alınmır?\" sualı stres mənbəyinə çevrilə bilər. Əslində isə, sağlam cütlüklərdə belə hamiləliyin baş tutması bir neçə ay çəkə bilər. Burada əsas sirr &lt;strong&gt;\"doğru zamanlama\"&lt;/strong&gt;dır.&lt;/p&gt;&lt;p&gt;Qadın orqanizmi ayda yalnız bir neçə gün (təxminən 5-6 gün) hamilə qalmağa qadirdir. Bu dövrə &lt;strong&gt;\"fertil pəncərə\"&lt;/strong&gt; deyilir və onun zirvəsi məhz &lt;strong&gt;ovulyasiya&lt;/strong&gt; günüdür. Bəs bu qızıl günü necə tutmaq olar? Gəlin, elmi və təbii üsullarla ovulyasiyanı hesablamağın yollarını öyrənək.&lt;/p&gt;&lt;h2 id=\"section-1\"&gt;Ovulyasiya nədir və nə vaxt baş verir?&lt;/h2&gt;&lt;p&gt;Ovulyasiya, yetkinləşmiş yumurta hüceyrəsinin yumurtalıqdan çıxaraq uşaqlıq borusuna düşməsi prosesidir. Bu zaman yumurta spermatozoidlə görüşməyə və mayalanmaya hazır olur.&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Ömrü qısadır:&lt;/strong&gt; Yumurta hüceyrəsi cəmi &lt;strong&gt;12-24 saat&lt;/strong&gt; yaşayır. Əgər bu müddətdə mayalanma baş verməzsə, o məhv olur.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Spermatozoidlərin gücü:&lt;/strong&gt; Spermatozoidlər qadın orqanizmində &lt;strong&gt;3-5 günə qədər&lt;/strong&gt; yaşaya bilir.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Nəticə:&lt;/strong&gt; Ən yüksək hamiləlik şansı ovulyasiyadan 3 gün əvvəl və ovulyasiya günündə olan cinsi əlaqə zamanı yaranır.&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;/p&gt;&lt;blockquote&gt;&lt;p&gt;Mif: \"Ovulyasiya həmişə dövrün tən ortasında, 14-cü gün baş verir.\"&lt;/p&gt;&lt;/blockquote&gt;&lt;p&gt;Həqiqət: Bu, yalnız 28 günlük ideal dövrü olan qadınlar üçündür. Hər qadının dövrü fərqlidir və ovulyasiya günü dəyişə bilər.&lt;/p&gt;&lt;p&gt;&amp;gt;&lt;/p&gt;&lt;h2 id=\"section-2\"&gt;Ovulyasiyanı hesablamağın 4 əsas üsulu&lt;/h2&gt;&lt;h3&gt;1. Təqvim metodu (Ən sadə, lakin ən az dəqiq)&lt;/h3&gt;&lt;p&gt;Bu üsul aybaşı dövrünüzün müntəzəm olduğu halda işə yarayır.&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Düstur:&lt;/strong&gt; Ovulyasiya adətən növbəti aybaşının başlamasına &lt;strong&gt;14 gün qalmış&lt;/strong&gt; baş verir.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Nümunə:&lt;/strong&gt; Əgər dövrünüz 30 gündürsə: 30 - 14 = 16. Deməli, ovulyasiya təxminən 16-cı gün baş verir.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Anacan köməyi:&lt;/strong&gt; Əllə hesablamaqla vaxt itirməyin. &lt;strong&gt;Anacan tətbiqində&lt;/strong&gt; sadəcə son aybaşının ilk gününü qeyd edin, ağıllı alqoritm sizin üçün fertil günləri hesablayacaq.&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;/p&gt;&lt;h3&gt;2. Ovulyasiya testləri (Ən dəqiq ev üsulu)&lt;/h3&gt;&lt;p&gt;Apteklərdə satılan bu testlər hamiləlik testlərinə bənzəyir, lakin fərqli hormonu axtarır: &lt;strong&gt;Lüteinləşdirici Hormon (LH)&lt;/strong&gt;. Ovulyasiyadan 24-36 saat əvvəl LH səviyyəsi kəskin artır.&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Necə istifadə etməli:&lt;/strong&gt; Təxmini ovulyasiya həftəsində hər gün eyni saatda (tercihən günorta) sidik testi edin. İki tünd xətt görsəniz, yaxın 24 saat ərzində ovulyasiya baş verəcək. Bu, cinsi əlaqə üçün ən ideal vaxtdır!&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;/p&gt;&lt;h3&gt;3. Bazal bədən temperaturu (BBT)&lt;/h3&gt;&lt;p&gt;Bu üsul səbr və intizam tələb edir, lakin orqanizminizi tanımaq üçün əladır.&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Qayda:&lt;/strong&gt; Hər səhər yataqdan qalxmadan, heç bir hərəkət etmədən (hətta su içmədən) temperaturunuzu ölçün.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;İşarə:&lt;/strong&gt; Ovulyasiyadan dərhal sonra progesteron hormonunun təsiri ilə temperaturunuz təxminən &lt;strong&gt;0.3 - 0.5 dərəcə&lt;/strong&gt; yüksəlir və aybaşıya qədər yüksək qalır.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Qeyd:&lt;/strong&gt; Bu metod ovulyasiyanın &lt;em&gt;baş verdiyini&lt;/em&gt; göstərir (artıq gec ola bilər), lakin bir neçə ay izlədikdən sonra öz qanunauyğunluğunuzu tapacaqsınız.&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;/p&gt;&lt;h3&gt;4. Servikal maye (İfrazat) metodu&lt;/h3&gt;&lt;p&gt;Bədəniniz sizə ən aşkar işarəni alt paltarınızda verir.&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Quru dövr:&lt;/strong&gt; Aybaşıdan dərhal sonra.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Yapışqan:&lt;/strong&gt; Ovulyasiyaya yaxınlaşdıqca.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;\"Yumurta ağı\" kimi:&lt;/strong&gt; Ovulyasiya günü ifrazat şəffaf, sürüşkən və uzanan olur (barmaqlarınız arasında uzada bilirsiniz). Bu maye spermatozoidlərin hərəkətini asanlaşdırır və ən fertil dövrü göstərir.&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;/p&gt;&lt;h2 id=\"section-3\"&gt;Hamilə qalmaq şansını artıran əlavə məsləhətlər&lt;/h2&gt;&lt;p&gt;Doğru günü hesablamaqla yanaşı, həyat tərzinizdə edəcəyiniz kiçik dəyişikliklər də böyük fərq yarada bilər:&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Stressi azaldın:&lt;/strong&gt; Kortizol (stress hormonu) ovulyasiyanı gecikdirə və ya ümumiyyətlə dayandıra bilər. Yoqa, meditasiya və ya sadəcə sevdiyiniz işlə məşğul olmaq hormonal balansınızı qoruyar.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Sağlam çəki:&lt;/strong&gt; Həm artıq çəki, həm də həddindən artıq arıqlıq hormonlara təsir edir.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Qidalanma:&lt;/strong&gt; Trans yağlardan uzaq durun, bitki mənşəli zülalları (mərci, noxud) artırın və fol turşusu qəbulunu unutmayın.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Siqaretdən imtina:&lt;/strong&gt; Siqaret yumurtalıqların ehtiyatını azaldır və yumurta keyfiyyətini pisləşdirir.&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;h2 id=\"section-4\"&gt;Nə vaxt həkimə müraciət etməli?&lt;/h2&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Əgər 35 yaşdan kiçiksinizsə və 1 il müntəzəm cəhdlərə baxmayaraq hamiləlik baş tutmursa.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Əgər 35 yaşdan böyüksünüzsə və 6 ay ərzində nəticə yoxdursa.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Aybaşılarınız çox nizamsızdırsa (və ya ümumiyyətlə yoxdursa).&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;/p&gt;&lt;p&gt;Ovulyasiya gününü bilmək hamiləliyə gedən yolda kompasınızdır. Bədəninizin dilini öyrənin, simptomları izləyin, amma prosesi mexaniki bir işə çevirməyin. Sevgi və yaxınlıq hissini qorumaq, ən azı LH testinin nəticəsi qədər vacibdir.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Anacan tətbiqini&lt;/strong&gt; yükləyərək simptomlarınızı qeyd etməyə başlayın. Biz sizə ən uyğun günləri xatırladacaq və bu həyəcanlı yolda yanınızda olacağıq.&lt;/p&gt;"]]},{"id": "test","stage": "flow","tone": "c-yellow","cat": "Hamiləlik","min": 5,"title": "Hamiləlik testi nə vaxt edilməlidir? Dəqiq nəticə üçün qızıl qaydalar","excerpt": "Hamiləlik testini nə vaxt etmək lazımdır? Aybaşı gecikməsini gözləməliyəm, yoxsa daha tez yoxlamaq olar? Dəqiq nəticə almaq üçün günün ən yaxşı saatı və HCG hormonu haqqında bilməli olduğunuz hər şey.","img": "img/art-test.webp","body": [["p","&lt;p&gt;Hamilə qalmağa çalışarkən və ya şübhələndiyiniz zaman \"gözləmək\" dünyanın ən çətin işi kimi görünə bilər. Hər aptekə girdiyinizdə rəfdəki o balaca qutulara baxıb \"bəlkə indi yoxlayım?\" deyə düşünürsünüz. Lakin tələsmək çox vaxt məyusluğa – \"yalançı mənfi\" nəticəyə və ya lazımsız stresə səbəb ola bilər.&lt;/p&gt;&lt;p&gt;Bəs o iki sehirli xətti görmək üçün ən ideal vaxt nə vaxtdır? Testi səhər, yoxsa axşam etmək fərq edirmi? Bu məqalədə, pulunuzu və əsəblərinizi qorumaq üçün hamiləlik testləri haqqında bütün həqiqətləri bir araya topladıq.&lt;/p&gt;&lt;h2 id=\"section-1\"&gt;Hamiləlik testləri necə işləyir? (HCG Hormonu)&lt;/h2&gt;&lt;p&gt;Testin nə vaxt edilməli olduğunu anlamaq üçün əvvəlcə onun nəyi axtardığını bilməlisiniz. Bütün ev tipli hamiləlik testləri sidikdə &lt;strong&gt;HCG (İnsan Xorionik Qonadotropini)&lt;/strong&gt; adlı xüsusi hormonu müəyyən etmək üçün işləyir.&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Proses:&lt;/strong&gt; Mayalanmış yumurta uşaqlıq divarına yapışdıqdan (implantasiya) sonra cift (plasenta) bu hormonu ifraz etməyə başlayır.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Müddət:&lt;/strong&gt; HCG səviyyəsi hər 2-3 gündən bir ikiqat artır. Lakin, testin onu \"görə bilməsi\" üçün hormonun müəyyən konsentrasiyaya çatması lazımdır.&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;/p&gt;&lt;p&gt;Əgər testi çox tez etsəniz, hamilə olsanız belə, HCG səviyyəsi hələ testin həssaslıq həddinə çatmamış ola bilər. Nəticə? Bir xətt və boş yerə üzüntü.&lt;/p&gt;&lt;h2 id=\"section-2\"&gt;Testi etmək üçün ən doğru zaman&lt;/h2&gt;&lt;p&gt;Burada əsas qayda səbrli olmaqdır. İki əsas yanaşma mövcuddur:&lt;/p&gt;&lt;h3&gt;1. Ən dəqiq nəticə: Aybaşı gecikməsindən sonra&lt;/h3&gt;&lt;p&gt;Həkimlərin və test istehsalçılarının əksəriyyəti &lt;strong&gt;aybaşı gecikməsini gözləməyi&lt;/strong&gt; (gözlənilən tarixdən ən azı 1 gün keçməsini) tövsiyə edir.&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Səbəb:&lt;/strong&gt; Bu dövrdə HCG səviyyəsi əksər qadınlarda standart testlərin müəyyən edə biləcəyi səviyyəyə çatır. Bu zaman testlərin dəqiqliyi 99%-ə yaxın olur.&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;/p&gt;&lt;h3&gt;2. Səbrsizlər üçün: Gecikmədən əvvəl (Erkən testlər)&lt;/h3&gt;&lt;p&gt;Bəzi \"Erkən Nəticə\" (Early Detection) testləri aybaşıya 4-5 gün qalmış nəticə göstərə biləcəyini iddia edir. Bu testlər daha həssasdır (HCG-ni daha aşağı miqdarda tutur).&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Risk:&lt;/strong&gt; Əgər mənfi nəticə alsanız, bu, hamilə olmadığınız anlamına gəlmir. Sadəcə hələ tez ola bilər. Belə halda, bir neçə gün sonra təkrar yoxlamaq lazımdır.&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;/p&gt;&lt;h2 id=\"section-3\"&gt;Günün hansı saatı daha yaxşıdır? Səhər, yoxsa Axşam?&lt;/h2&gt;&lt;p&gt;\"Testi mütləq səhər etmək lazımdır\" fikri sadəcə bir mif deyil, elmi əsası olan tövsiyədir.&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Səhər ilk sidik:&lt;/strong&gt; Gecə boyu toplandığı üçün ən yüksək konsentrasiyaya malik olur. HCG hormonu burada ən sıx haldadır. Erkən dövrdə (gecikmədən əvvəl və ya gecikmə günü) səhər testi etmək şərtdir.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Günorta və Axşam:&lt;/strong&gt; Əgər aybaşınız artıq 1-2 həftə gecikibsə, HCG səviyyəsi o qədər yüksək olur ki, günün istənilən saatında test edə bilərsiniz.&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;/p&gt;&lt;blockquote&gt;&lt;p&gt;Vacib qeyd: Testdən əvvəl həddindən artıq su və ya çay içmək sidiyi durulaşdırır və HCG konsentrasiyasını azaldır. Bu, yalançı mənfi nəticəyə səbəb ola bilər.&lt;/p&gt;&lt;/blockquote&gt;&lt;p&gt;&amp;gt;&lt;/p&gt;&lt;h2 id=\"section-4\"&gt;Yalançı Mənfi və Yalançı Müsbət nəticələr&lt;/h2&gt;&lt;p&gt;Bəzən testlər bizi aldada bilər. Bunun səbəblərini bilmək vacibdir:&lt;/p&gt;&lt;h3&gt;Yalançı Mənfi (Hamiləsiniz, amma test \"yox\" deyir)&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Səbəb 1:&lt;/strong&gt; Testi çox tez etmisiniz (ən yayılmış səbəb).&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Səbəb 2:&lt;/strong&gt; Sidik çox duru olub (çox su içmisiniz).&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Səbəb 3:&lt;/strong&gt; Testin istifadə müddəti bitib.&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;/p&gt;&lt;h3&gt;Yalançı Müsbət (Hamilə deyilsiniz, amma test \"hə\" deyir)&lt;/h3&gt;&lt;p&gt;Bu daha nadir haldır, lakin mümkündür:&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Kimyəvi hamiləlik:&lt;/strong&gt; Mayalanma baş verib, lakin embrion inkişaf etməyib.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Buxarlanma xətti:&lt;/strong&gt; Testə baxmaq üçün verilən vaxt (adətən 5-10 dəqiqə) keçdikdən sonra yaranan solğun, boz rəngli xətt. Bu, müsbət nəticə deyil.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Bəzi dərmanlar:&lt;/strong&gt; Tərkibində HCG olan sonsuzluq dərmanları nəticəyə təsir edə bilər.&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;/p&gt;&lt;h2 id=\"section-5\"&gt;Qan analizi (HCG) nə vaxt verilməlidir?&lt;/h2&gt;&lt;p&gt;Əgər ev testləri sizi çaş-baş salıbsa və ya daha dəqiq nəticə istəyirsinizsə, qan analizi ən etibarlı yoldur.&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Qan analizi HCG-ni sidik testindən daha tez (mayalanmadan 7-10 gün sonra) və dəqiq müəyyən edir.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Bu analiz həmçinin hormonun dəqiq miqdarını (beta-HCG) göstərərək, hamiləliyin neçənci həftəsində olduğunuzu və inkişafın normal gedib-getmədiyini izləməyə imkan verir.&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;/p&gt;&lt;h2 id=\"section-6\"&gt;Dəqiq nəticə üçün 5 Qızıl Qayda&lt;/h2&gt;&lt;p&gt;Evdə hamiləlik testindən istifadə edərkən bu addımları mütləq izləyin:&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Tarixə baxın:&lt;/strong&gt; Testi alarkən istifadə müddətini mütləq yoxlayın. Köhnə testlər səhv nəticə verir.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Təlimatı oxuyun:&lt;/strong&gt; Hər markanın qaydaları fərqli ola bilər (məsələn, sidikdə saxlama müddəti).&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Səhəri gözləyin:&lt;/strong&gt; Ən dəqiq nəticə üçün səhər yuxudan duran kimi ilk sidikdən istifadə edin.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Saat tutun:&lt;/strong&gt; Nəticəyə təlimatda göstərilən vaxt aralığında (məsələn, 3-5 dəqiqə sonra) baxın. 10 dəqiqədən sonra yaranan xətlərə inanmayın.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;Təkrar edin:&lt;/strong&gt; Əgər nəticə mənfidirsə, amma aybaşınız hələ də gəlməyibsə, 2-3 gün sonra testi təkrarlayın.&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;Hamiləlik testi etmək həyəcanlı bir an, nəticəni gözləmək isə əbədiyyət kimi gələ bilər. Ən yaxşı strategiya – təbiətə bir az zaman vermək və ən azı aybaşı gününü gözləməkdir.&lt;/p&gt;&lt;p&gt;Nəticə müsbətdirsə, təbriklər! Sizi möhtəşəm bir səyahət gözləyir. İndi növbəti addım həkim qəbuluna yazılmaq və &lt;strong&gt;Anacan tətbiqini&lt;/strong&gt; yükləyərək körpənizin inkişafını həftə-həftə izləməkdir. Nəticə mənfidirsə, ruhdan düşməyin; bəlkə sadəcə hələ çox tezdir.&lt;/p&gt;"]]}];

function home() { return S.stage === "mommy" ? homeMommy() : S.stage === "flow" ? homeFlow() : homeBump(); }

function ring(pct, size, core, stroke = 9) {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r, off = c * (1 - Math.max(0, Math.min(100, pct)) / 100);
  const ang = 2 * Math.PI * Math.max(0, Math.min(100, pct)) / 100, tx = size / 2 + r * Math.cos(ang), ty = size / 2 + r * Math.sin(ang);
  return `<div class="ring" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}" aria-hidden="true"><circle class="track" cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke-width="${stroke}"/><circle class="fill" cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" style="--c:${c}"/><circle class="tip" cx="${tx.toFixed(1)}" cy="${ty.toFixed(1)}" r="${stroke / 2 + 2}"/></svg><div class="core">${core}</div></div>`;
}
function miniRing(done, total) {
  const size = 44, r = 18, c = 2 * Math.PI * r, off = c * (1 - (total ? done / total : 0));
  return `<div class="mini-ring num"><svg width="${size}" height="${size}" aria-hidden="true"><circle cx="22" cy="22" r="${r}" fill="none" stroke="var(--coral-soft)" stroke-width="5"/><circle cx="22" cy="22" r="${r}" fill="none" stroke="var(--coral)" stroke-width="5" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg>${done}/${total}</div>`;
}

/* Daily plan derives its ticks from what the user already logged elsewhere */
function planItems() {
  const p = S.stage === "bump" ? preg() : null;
  const items = [];
  items.push({ id: "vit", label: "Vitaminləri qəbul et", done: vitToday().length > 0, a: "sheet", v: "vitamins", icon: "pill", tone: "c-yellow" });
  items.push({ id: "water", label: "8 stəkan su iç", sub: `${water()}/8`, done: water() >= 8, a: "sheet", v: "water", icon: "drop", tone: "c-blue" });
  if (S.stage === "bump" && p.week >= 28) items.push({ id: "kick", label: "Təpikləri say", sub: "2 saatda 10 hərəkət", done: S.kickSessions.some((s) => s.t >= today0().getTime()), a: "tool", v: "kicks", icon: "foot", tone: "c-peach" });
  if (S.stage === "mommy") items.push({ id: "tummy", label: "Qarın üstə oyun, 15 dəq", done: !!(S.manual[tk()] || {}).tummy, a: "manual", v: "tummy", icon: "star", tone: "c-peach" });
  items.push({ id: "walk", label: S.stage === "mommy" ? "Körpə ilə gəzinti" : "30 dəqiqə gəzinti", done: !!(S.manual[tk()] || {}).walk, a: "manual", v: "walk", icon: "foot", tone: "c-green" });
  items.push({ id: "mood", label: "Əhvalını qeyd et", done: !!moodToday(), a: "sheet", v: "mood", icon: "smile", tone: "c-pink" });
  return items;
}
function dayPlan() {
  const items = planItems(), done = items.filter((x) => x.done).length;
  return `<section class="sec" data-plan="${done}/${items.length}"><div class="card pad-card" style="gap:4px">
    <div class="plan-head">${miniRing(done, items.length)}<div class="grow"><p class="h-sub">Bu günün planı</p><p class="meta">${done === items.length ? "Hamısı tamamlandı. Əla gün!" : `${items.length - done} addım qalıb`}</p></div></div>
    <div class="list">${items.map((x) => `<button class="li ${x.done ? "done" : ""}" data-a="${x.a}" data-v="${x.v}"><span class="check ${x.done ? "on" : ""}">${ic("check", "s14")}</span><span class="grow"><span class="small" style="display:block;font-weight:500">${x.label}</span>${x.sub ? `<span class="meta">${x.sub}</span>` : ""}</span><span class="ico-sq sm ${x.tone}">${ic(x.icon, "s16")}</span></button>`).join("")}</div>
  </div></section>`;
}

/* Upcoming: user's appointments merged with stage milestones, soonest first */

  if (S.stage === "bump") {
    const lmp = fromIso(S.lmp).getTime();
    [[24, "Qlükoza testi", "Gestasion diabet skrininqi, 24–28-ci həftə"], [28, "Rh faktoru və anemiya analizi", "Üçüncü trimestrin başlanğıcı"], [30, "Tdap peyvəndi", "Göy öskürəyə qarşı, 27–36-cı həftə"], [32, "III trimestr USM", "Körpənin vəziyyəti və çəkisi"], [36, "Çanta hazır olsun", "Xəstəxana çantasını yoxlayın"], [40, "Təxmini doğuş tarixi", "Doğuş 38–42-ci həftələr arası normaldır"]]
      .forEach(([w, title, sub]) => ev.push({ t: lmp + w * 7 * DAY, title, sub, tag: `${w}-cı hft`.replace(/(\d+)-cı/, (m, n) => ord(Number(n))), a: w === 36 ? "tool" : "", v: w === 36 ? "bag" : "" }));
  }
  if (S.stage === "mommy") {
    const b = fromIso(childNow().birth);
    VACCINES.forEach(([w, v, m]) => { const d = new Date(b); d.setMonth(b.getMonth() + m); ev.push({ t: d.getTime(), title: `Peyvənd: ${w}`, sub: v, tag: "Peyvənd", a: "tool", v: "vaccines" }); });
  }
  if (S.stage === "flow") {
    const c = cycle();
    ev.push({ t: now + c.toOv * DAY, title: "Təxmini ovulyasiya", sub: "Məhsuldarlıq ən yüksəkdir", tag: "Dövr", a: "tool", v: "cycle" });
    ev.push({ t: now + c.next * DAY, title: "Növbəti aybaşı", sub: `${S.periodLen} gün davam edir`, tag: "Dövr", a: "tool", v: "cycle" });
  }
  const list = ev.filter((e) => e.t >= now).sort((x, y) => x.t - y.t).slice(0, 3);

}

    <section class="sec">${secHead("Ay-ay inkişaf", `<span class="meta">${ord(fm)} ay</span>`)}<div class="rail months">${Array.from({ length: 9 }, (_, i) => i + 1).map((m) => { const w = Math.min(40, Math.max(4, Math.floor((m - 1) * 4.4) + 1)); return `<button class="month ${m === fm ? "on" : m < fm ? "past" : "future"}" data-a="sheet" data-v="week:${w}"><img src="img/month-${m}.svg" alt="" loading="lazy"><span>${ord(m)} ay</span><small>${Math.floor((m - 1) * 4.4) + 1}–${m === 9 ? 40 : Math.floor(m * 4.4)}. həftə</small></button>`; }).join("")}</div></section>
    <section class="sec">${secHead(isNow ? "Bu həftə" : `${ord(vw)} həftə`)}${infoTabs([["Körpə", range(DEV, vw)], ["Siz", range(BODY, vw)], ["Tövsiyə", range(TIPS, vw)]])}</section>

const head = (title, right = "") => `<div class="grabber" data-drag aria-hidden="true"></div><div class="sheet-head pad" data-drag><button class="icon-btn solid" data-a="close" aria-label="Bağla">${ic("x", "s18")}</button><h2 class="h-title">${title}</h2>${right}</div>`;

function renderSheet() {
  const s = UI.sheet;
  const phone = document.getElementById("phone");
  if (!s) { $sheet.classList.remove("open"); phone.classList.remove("sheeted"); return; }
  phone.classList.add("sheeted");
  const i = String(s).indexOf(":"), type = i < 0 ? s : s.slice(0, i), arg = i < 0 ? "" : s.slice(i + 1);
  const fn = SHEETS[type];
  patch($sheet, fn ? fn(arg) : wrap("", ""), UI.sheetFresh); UI.sheetFresh = false;
  $sheet.classList.add("open");
  tick(); runStory();
}

/* Small SVG charts: bars for daily counts, a line for measurements */
function barChart(values, labels, goal) {
  const W = 320, H = 120, pad = 18, max = Math.max(goal || 0, ...values, 1), bw = (W - pad * 2) / values.length;
  const y = (v) => H - pad - (v / max) * (H - pad * 2);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Son ${values.length} gün">
    ${goal ? `<line class="axis" x1="${pad}" x2="${W - pad}" y1="${y(goal)}" y2="${y(goal)}" stroke-dasharray="4 4"/><text x="${W - pad}" y="${y(goal) - 4}" text-anchor="end">məqsəd ${goal}</text>` : ""}
    ${values.map((v, i) => `<rect x="${pad + i * bw + bw * 0.22}" y="${y(v)}" width="${bw * 0.56}" height="${Math.max(2, H - pad - y(v))}" rx="5" fill="${i === values.length - 1 ? "var(--coral)" : "var(--coral-soft)"}"/><text x="${pad + i * bw + bw / 2}" y="${H - 4}" text-anchor="middle">${labels[i]}</text>`).join("")}
  </svg>`;
}
function lineChart(points, unit) {
  if (points.length < 2) return "";
  const W = 320, H = 130, pad = 22, vs = points.map((p) => p.v), lo = Math.min(...vs), hi = Math.max(...vs), span = hi - lo || 1;
  const x = (i) => pad + i * (W - pad * 2) / (points.length - 1), y = (v) => H - pad - (v - lo) / span * (H - pad * 2);
  const d = points.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(" ");
  const last = points[points.length - 1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Dəyişmə qrafiki">
    <line class="axis" x1="${pad}" x2="${W - pad}" y1="${H - pad}" y2="${H - pad}"/>
    <path d="${d} L${x(points.length - 1)},${H - pad} L${pad},${H - pad} Z" fill="var(--coral-soft)" opacity=".7"/>
    <path d="${d}" fill="none" stroke="var(--coral)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(points.length - 1)}" cy="${y(last.v)}" r="5" fill="var(--coral)" stroke="var(--surface)" stroke-width="2"/>
    <text x="${pad}" y="${H - 6}">${dayMonth(points[0].t)}</text><text x="${W - pad}" y="${H - 6}" text-anchor="end">${fmt(last.v)} ${unit}</text>
  </svg>`;
}

/* ================= v5: DOM morphing (only changed nodes are touched) ================= */
const tpl = document.createElement("template");
function morphChildren(from, to) {
  const a = from.childNodes, b = to.childNodes;
  let i = 0;
  for (; i < b.length; i++) {
    const next = b[i], cur = a[i];
    if (!cur) { from.appendChild(next.cloneNode(true)); continue; }
    if (cur.nodeType !== next.nodeType || cur.nodeName !== next.nodeName) { from.replaceChild(next.cloneNode(true), cur); continue; }
    if (cur.nodeType === 3 || cur.nodeType === 8) { if (cur.nodeValue !== next.nodeValue) cur.nodeValue = next.nodeValue; continue; }
    morphEl(cur, next);
  }
  while (a.length > b.length) from.removeChild(from.lastChild);
}
function morphEl(cur, next) {
  const keep = cur === document.activeElement && (cur.tagName === "INPUT" || cur.tagName === "TEXTAREA");
  for (const { name } of [...cur.attributes]) if (!next.hasAttribute(name) && !(keep && name === "value")) cur.removeAttribute(name);
  for (const { name, value } of [...next.attributes]) if (cur.getAttribute(name) !== value && !(keep && name === "value")) cur.setAttribute(name, value);
  if ((cur.tagName === "INPUT" || cur.tagName === "TEXTAREA") && !keep && cur.value !== (next.getAttribute("value") ?? next.textContent ?? "")) cur.value = next.getAttribute("value") ?? (cur.tagName === "TEXTAREA" ? next.textContent : "");
  if (cur.tagName !== "TEXTAREA") morphChildren(cur, next);
}
function patch(el, html, fresh) {
  if (fresh || !el.firstChild) { el.innerHTML = html; return; }
  tpl.innerHTML = html;
  morphChildren(el, tpl.content);
}

const KINDS = [["Butulka", "bottle", "c-blue"], ["Fincan və su qabı", "drop", "c-green"], ["Qab və boşqab", "chef", "c-peach"], ["Qaşıq və çəngəl", "leaf", "c-yellow"], ["Texnika", "gauge", "c-lav"], ["Uşaq qidası", "heart", "c-pink"]];

const FREE_SHIP = 30, SHIP_FEE = 3, PROMO = { ANACAN10: 0.1 };
const azn = (n) => `${(Math.round(n * 100) / 100).toFixed(2).replace(".", ",")} ₼`;
const prod = (id) => PRODUCTS.find((p) => p.id === id);
const off = (p) => p.o ? Math.round((1 - p.p / p.o) * 100) : 0;
const inCart = (id) => (S.cart.find((c) => c.id === id) || {}).q || 0;
const cartCount = () => S.cart.reduce((s, c) => s + c.q, 0);
function cartTotals() {
  const sub = S.cart.reduce((s, c) => s + (prod(c.id)?.p || 0) * c.q, 0);
  const bdisc = BUNDLES.filter(bundleDone).reduce((s, b) => s + bundleSum(b) * BUNDLE_OFF, 0);
  const disc = S.promo && PROMO[S.promo] ? (sub - bdisc) * PROMO[S.promo] : 0;
  const ship = sub - bdisc - disc >= FREE_SHIP || sub === 0 ? 0 : SHIP_FEE;
  return { sub, bdisc, disc, ship, total: sub - bdisc - disc + ship };
}
const ageLabel = (a) => a == null ? "" : a === 0 ? "0+ ay" : `${a}+ ay`;

function recommended() {
  if (S.stage === "mommy") { const m = babyAge().months; return { title: `${childNow().name} üçün uyğun`, sub: `${m} aylıq körpəyə görə seçilib`, list: PRODUCTS.filter((p) => p.age != null && p.age <= m + 2).sort((a, b) => (b.age - a.age) || (b.sold - a.sold)) }; }
  if (S.stage === "bump") return { title: "Doğuşa hazırlıq", sub: "Yenidoğulmuş üçün ilk butulka və qablar", list: PRODUCTS.filter((p) => p.age === 0 || p.age === 1 || p.k === "Texnika").sort((a, b) => b.sold - a.sold) };
  return { title: "Ən çox satılanlar", sub: "Anaların seçimi", list: PRODUCTS.slice().sort((a, b) => b.sold - a.sold) };
}

function pcard(p, cls = "") {
  const q = inCart(p.id), fav = S.fav.includes(p.id);
  return `<article class="pc ${cls}">
    <button class="pc-img" data-a="shop-go" data-v="product:${p.id}" aria-label="${esc(p.n)}"><img src="${p.img[0]}" alt="" loading="lazy" decoding="async">${p.o ? `<span class="pc-off">−${off(p)}%</span>` : ""}</button>
    <button class="pc-fav ${fav ? "on" : ""}" data-a="fav" data-v="${p.id}" aria-label="${fav ? "Seçilmişlərdən çıxar" : "Seçilmişlərə əlavə et"}" aria-pressed="${fav}">${ic("heart", "s16")}</button>
    <div class="pc-body"><p class="meta clip1">${p.b}</p><button class="pc-name clip2" data-a="shop-go" data-v="product:${p.id}">${esc(p.n)}</button>
      <div class="pc-foot"><div class="pc-price num"><b>${azn(p.p)}</b>${p.o ? `<s>${azn(p.o)}</s>` : ""}</div>
      ${q ? `<div class="qty sm"><button data-a="cart-dec" data-v="${p.id}" aria-label="Azalt">${ic("minus", "s14")}</button><span class="num">${q}</span><button data-a="cart-inc" data-v="${p.id}" aria-label="Artır">${ic("plus", "s14")}</button></div>`
        : `<button class="pc-add" data-a="cart-add" data-v="${p.id}" aria-label="Səbətə əlavə et">${ic("plus", "s18")}</button>`}</div></div>
  </article>`;
}

  return `<section class="offer" aria-label="Anacan Aptek təklifi">

}
function bundleCard(b, compact) {
  const sum = bundleSum(b), done = bundleDone(b);
  return `<article class="bundle ${compact ? "compact" : ""}">
    <div class="b-thumbs ${b.tone}">${b.ids.map((id) => `<button data-a="shop-go" data-v="product:${id}" aria-label="${esc(prod(id).n)}"><img src="${prod(id).img[0]}" alt="" loading="lazy"></button>`).join(`<span class="b-plus">${ic("plus", "s14")}</span>`)}</div>
    <div class="b-body"><div style="min-width:0"><p class="h-sub">${b.t}</p>${compact ? "" : `<p class="meta">${b.d}</p>`}<p class="num b-price"><b>${azn(sum * (1 - BUNDLE_OFF))}</b><s>${azn(sum)}</s><span class="chip ac">−${Math.round(BUNDLE_OFF * 100)}% dəst</span></p></div>
      <button class="btn sm ${done ? "soft" : "accent"}" data-a="${done ? "shop-go" : "bundle-add"}" data-v="${done ? "cart" : b.id}">${done ? `${ic("check", "s14")} Səbətdə` : "Dəsti əlavə et"}</button></div>

}

/* ================= White noise (Web Audio) ================= */
let audio = null;
function playNoise(kind) {
  stopNoise();
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const len = ctx.sampleRate * 3, buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
    let b0 = 0, b1 = 0, b2 = 0, last = 0;
    for (let i = 0; i < len; i++) {
      const w = Math.random() * 2 - 1;
      if (kind === "pink") { b0 = 0.997 * b0 + w * 0.029591; b1 = 0.985 * b1 + w * 0.032534; b2 = 0.95 * b2 + w * 0.048056; d[i] = (b0 + b1 + b2 + w * 0.05) * 1.6; }
      else if (kind === "brown") { last = (last + 0.02 * w) / 1.02; d[i] = last * 3.2; }
      else d[i] = w * 0.35;
    }
    const src = ctx.createBufferSource(), gain = ctx.createGain();
    src.buffer = buf; src.loop = true; gain.gain.value = 0.25;
    src.connect(gain).connect(ctx.destination); src.start();
    audio = { ctx, src }; UI.noise = kind;
  } catch (e) { toast("Bu brauzerdə səs çalınmadı"); UI.noise = null; }
}
function stopNoise() { if (audio) { try { audio.src.stop(); audio.ctx.close(); } catch (e) { /* ignore */ } } audio = null; UI.noise = null; }

let toastT;

  $toast.innerHTML = `<span></span>${undo ? `<button data-a="undo">Geri al</button>` : ""}`;

  $toast.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => { $toast.classList.remove("show"); UI.undo = null; }, undo ? 4000 : 2200);
}
function scrollSheet(toEnd, top = 0) { const n = document.getElementById("sheet-scroll"); if (n) n.scrollTop = toEnd ? n.scrollHeight : top; }

}

function answer(q) {
  const n = " " + q.toLocaleLowerCase("az").replace(/i̇/g, "i") + " ";
  const hit = KB.find((e) => e.k.some((k) => n.includes(k)));
  if (!hit) return { t: "Bu sual üçün hazır cavabım yoxdur. Həkiminizlə dəqiqləşdirməyi tövsiyə edirəm. Qidalanma, yuxu, idman, təpik, sancı, təzyiq və ya vitaminlər haqqında soruşa bilərsiniz." };
  let t = hit.a;
  if (hit.dyn === "week") { const w = Math.min(40, Math.max(4, preg().week)); t = `${ord(w)} həftədə körpəniz ${WEEKS[w][0]} boydadır (${fmt(WEEKS[w][1])} sm, ${WEEKS[w][2]} q). ${range(DEV, w)}`; }
  if (hit.dyn === "cycle") { const c = cycle(); t = `Dövrünüzün ${ord(c.day)} günüdür: ${c.phase.toLowerCase()}. ${S.cycleLen} günlük dövrə görə növbəti aybaşına ${c.next} gün qalıb.`; }
  if (hit.dyn === "fertile") { const c = cycle(); t = c.toOv === 0 ? "Bu gün təxmini ovulyasiya günüdür, məhsuldarlıq ən yüksəkdir." : `Təxmini ovulyasiyaya ${c.toOv} gün qalıb. Məhsuldar pəncərə ovulyasiyadan 5 gün əvvəl başlayır və 1 gün sonra bitir.`; }
  const tool = hit.tool && stageTools().some((x) => x.id === hit.tool) ? hit.tool : null;
  const art = hit.art && ARTICLES.some((x) => x.id === hit.art && x.stage === S.stage) ? hit.art : null;
  const offer = hit.offer && OFFERS[hit.offer] && (hit.offer === "bag" ? S.stage === "bump" : S.stage === "mommy") ? hit.offer : null;
  return { t: esc(t), tool, art, offer };
}
function sendAsk(q) {
  q = (q || "").trim(); if (!q) return;
  UI.tab = "ask"; if (!UI.chat.length) UI.chat.push({ r: "ai", t: greetMsg() });
  UI.chat.push({ r: "me", t: esc(q) }, { r: "ai", typing: true }); render(false);
  setTimeout(() => { UI.chat.pop(); UI.chat.push({ r: "ai", fresh: !REDUCED, ...answer(q) }); if (UI.tab === "ask") render(false); haptic(); }, 800);
}

  "water-sub"() { water(); S.water.n = Math.max(0, S.water.n - 1); S.waterHist[tk()] = S.water.n; refresh(); },

  weekcheck(v) { const [w, k] = v.split(":").map(Number); const a = S.weekChecks[w] || []; S.weekChecks[w] = a.includes(k) ? a.filter((x) => x !== k) : a.concat(k); refresh(); },
  "story-next"(v) {
    const [who, k] = v.split("|"), i = STORIES.findIndex((x) => x.who === who); S.seenStories[who] = true; save();

  },

  reset() { stopNoise(); try { localStorage.removeItem(KEY); } catch (e) { /* ignore */ } S = defaults(); Object.assign(UI, { tab: "home", chat: [], onbStep: 0, onbStage: null, sheet: null, viewWeek: null, weekTab: 0 }); applyTheme(); renderSheet(); render(false); },
  "ask-q"(v) { sendAsk(v); }, toast(v) { toast(v); }
};

Object.assign(ACTIONS, SHOP_ACTIONS, OFFER_ACTIONS);
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-a]");
  if (!el || el.disabled) return;
  const fn = ACTIONS[el.dataset.a];
  if (fn) { e.preventDefault(); fn(el.dataset.v); }
});
document.addEventListener("submit", (e) => {
  const f = e.target.closest("[data-form]"); if (!f) return;
  e.preventDefault();
  const data = new FormData(f), kind = f.dataset.form, val = (k) => String(data.get(k) || "").trim();
  if (kind === "ask") sendAsk(val("q"));
  if (kind === "toolsearch") { UI.toolQuery = val("q"); render(); }
  if (kind === "weight") { const kg = parseFloat(val("kg").replace(",", ".")); if (!(kg > 30 && kg < 250)) { toast("Çəkini kq ilə daxil edin, məsələn 64,5"); return; } S.weights.push({ t: Date.now(), kg: Math.round(kg * 10) / 10 }); refresh(); toast("Çəki saxlanıldı"); }
  if (kind === "bp") { const s = parseInt(val("s"), 10), d = parseInt(val("d"), 10); if (!(s > 60 && s < 260 && d > 30 && d < 180)) { toast("Məsələn 120 və 80 daxil edin"); return; } S.bp.push({ t: Date.now(), s, d }); refresh(); }
  if (kind === "shop") { S.shop.unshift([val("item").slice(0, 60), false]); refresh(); document.getElementById("f-shop")?.focus(); }
  if (kind === "post") { const t = val("text"); if (!t) return; S.myPosts.unshift({ id: "m" + Date.now(), name: S.name || "Siz", meta: "indicə", topic: UI.composeTopic, text: t.slice(0, 500), likes: 0, com: [] }); UI.sheet = null; UI.commTab = "feed"; UI.feedFilter = "Hamısı"; renderSheet(); refresh(); toast("Paylaşıldı"); }
  if (kind === "comment") { const id = f.dataset.id; (S.myCom[id] = S.myCom[id] || []).push([S.name || "Siz", val("t").slice(0, 300)]); refresh(); }
  if (kind === "dm") {
    const id = f.dataset.id, t = val("t"); if (!t) return;
    (S.dm[id] = S.dm[id] || []).push(["me", t.slice(0, 500)]); refresh(); document.getElementById("f-dm")?.focus();
    setTimeout(() => { S.dm[id].push(["them", "Çox sağ ol, sonra yazaram!"]); refresh(); }, 1200);
  }
  if (kind === "shopsearch") { const q = val("q"); if (q) shopNav(`list:q:${q}`); }
  if (kind === "promo") { const c = val("code").toUpperCase(); if (PROMO[c]) { S.promo = c; refresh(); toast(`${Math.round(PROMO[c] * 100)}% endirim tətbiq olundu`); } else { S.promo = ""; refresh(); toast("Promo kod tapılmadı"); } }
  if (kind === "appt") { S.appts.push({ title: val("title").slice(0, 60), d: val("d") || tk(), time: val("time") || "10:00", who: val("who").slice(0, 60) }); refresh(); toast("Görüş əlavə olundu"); }
  if (kind === "child") { S.children.push({ name: val("name").slice(0, 30) || "Körpə", birth: val("birth") || tk() }); S.child = S.children.length - 1; UI.sheet = null; renderSheet(); refresh(); toast("Uşaq əlavə olundu"); }
  if (kind === "onb") { UI.enter = true;
    S.name = val("name").slice(0, 40); S.stage = UI.onbStage; const d = val("date");
    if (S.stage === "bump") S.lmp = d; else if (S.stage === "mommy") { S.children = [{ name: val("baby").slice(0, 30) || "Körpə", birth: d }]; S.child = 0; } else S.cycleStart = d;
    save(); render(false);
  }
});

let drag = null;
document.addEventListener("pointerdown", (e) => {
  if (e.target.closest("button, a, input, textarea")) return;
  const hero = e.target.closest("[data-swipe]"), handle = e.target.closest("[data-drag]");
  if (hero) drag = { kind: "hero", x: e.clientX, y: e.clientY, el: hero.querySelector(".hero-main") };

});
document.addEventListener("pointermove", (e) => {
  if (!drag) return;
  if (drag.kind === "hero") { const dx = e.clientX - drag.x; if (Math.abs(dx) > Math.abs(e.clientY - drag.y)) drag.el.style.transform = `translateX(${dx * 0.4}px)`; }
  else { const dy = Math.max(0, e.clientY - drag.y); $sheet.style.transform = `translateY(${dy}px)`; }
});
document.addEventListener("pointerup", (e) => {
  if (!drag) return; const d = drag; drag = null;
  if (d.kind === "hero") { const dx = e.clientX - d.x; d.el.style.transform = ""; if (Math.abs(dx) > 48) ACTIONS.week(dx < 0 ? 1 : -1); }
  else { const dy = e.clientY - d.y; $sheet.classList.remove("dragging"); $sheet.style.transform = ""; if (dy > 110) ACTIONS.close(); }
});
document.addEventListener("pointercancel", () => { if (drag && drag.kind === "sheet") { $sheet.classList.remove("dragging"); $sheet.style.transform = ""; } else if (drag) drag.el.style.transform = ""; drag = null; });
